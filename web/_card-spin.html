<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>결과 카드 등장 회전 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<style>
  body{background:#F6F6F5;font-family:'Pretendard',sans-serif;margin:0;padding:34px 30px 90px;color:#16140F;}
  .wrap{max-width:1000px;margin:0 auto;}
  .htop{font-size:20px;font-weight:800;letter-spacing:-.03em;}
  .hsub{margin:8px 0 18px;font-size:13.5px;color:#6E6B63;line-height:1.6;}
  .play{background:#16140F;color:#fff;border:none;border-radius:11px;padding:11px 20px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;margin-bottom:26px;}
  .row{display:flex;gap:40px;flex-wrap:wrap;}
  .col{width:300px;}
  .nm{font-size:14px;font-weight:800;margin:0 0 3px;} .ds{font-size:12.5px;color:#6E6B63;margin:0 0 14px;min-height:32px;line-height:1.45;}
  .stage{perspective:1600px;}
  .card{width:300px;height:508px;border-radius:22px;position:relative;overflow:hidden;color:#f3f4f2;padding:20px;
    display:flex;flex-direction:column;align-items:center;transform-style:preserve-3d;
    background:radial-gradient(ellipse 70% 34% at 50% 11%, rgba(156,193,174,.17), transparent 60%), linear-gradient(160deg,#191a1f,#0f1014);}
  .fig{width:80px;height:120px;background:#9CC1AE;clip-path:polygon(38% 0,62% 0,62% 64%,64% 100%,36% 100%,38% 64%);margin:auto 0 8px;}
  .code{font-size:12px;font-weight:800;letter-spacing:.22em;color:#9CC1AE;}
  .word{margin-top:9px;font-size:26px;font-weight:800;}
  .tag{margin-top:12px;display:flex;gap:6px;} .tag span{font-size:11px;color:#CBDDD2;background:rgba(255,255,255,.09);padding:4px 10px;border-radius:20px;}

  /* A — 세로축 1바퀴(Y) : 앞→뒤→앞 */
  .A.go .card{animation:spinY 1s cubic-bezier(.3,.7,.3,1) .15s both;}
  @keyframes spinY{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
  /* B — 등장하며 살짝 기울다 회전(입체감) */
  .B.go .card{animation:spinIn 1.1s cubic-bezier(.2,.8,.25,1) .1s both;}
  @keyframes spinIn{0%{transform:rotateY(-90deg) scale(.9);opacity:0}55%{opacity:1}100%{transform:rotateY(0) scale(1);opacity:1}}
  /* C — 반 바퀴 튕겨 안착(플립 리빌 느낌) */
  .C.go .card{animation:flipSettle 1.15s cubic-bezier(.34,1.4,.5,1) .1s both;}
  @keyframes flipSettle{0%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
</style></head><body>
<div class="wrap">
  <div class="htop">결과 카드 등장 회전 — 모션 시안</div>
  <div class="hsub">결과가 뜨는 순간 카드가 한 번 도는 연출이에요. ▶ 누르면 세 개 동시에 재생돼요.</div>
  <button class="play" onclick="play()">▶ 다시 재생</button>
  <div class="row" id="row"></div>
</div>
<script>
  var CARD='<div class="card"><div class="fig"></div><div class="code">BAL</div><div class="word">이지 밸런스</div><div class="tag"><span>#밸런스</span><span>#베이직</span><span>#데일리</span></div></div>';
  var C=[['A','세로축 1바퀴 (rotateY 360°)','앞→옆→뒤→앞 · 카드가 한 바퀴 빙글'],
         ['B','옆에서 열리며 안착','왼쪽에서 90° 돌아 나오며 등장 · 자연스러운 입장'],
         ['C','반 바퀴 튕겨 안착','뒷면부터 돌아 살짝 오버슛 후 딱 · 리빌 느낌 (추천)']];
  document.getElementById('row').innerHTML=C.map(function(c){
    return '<div class="col"><p class="nm">'+c[0]+' · '+c[1]+'</p><p class="ds">'+c[2]+'</p><div class="stage '+c[0]+'">'+CARD+'</div></div>';
  }).join('');
  function play(){ document.querySelectorAll('.stage').forEach(function(s){ s.classList.remove('go'); void s.offsetWidth; s.classList.add('go'); }); }
  play();
</script>
</body></html>
