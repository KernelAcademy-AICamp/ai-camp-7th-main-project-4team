<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>핏 히어로 전체 흐름 — 인트로 → 딜 → 모으기 → 뒤집기 CTA</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/tokens.css?v=8e429c15">
<style>
/* ==========================================================================
   _home-full.html — 확정 조각 이어붙인 히어로 전체 흐름(한 번 재생).
   ① 인트로: "당신의 체형…" → Fitting 로고 실제이동(FLIP) + 줄자 밑줄 씽씽
   ② 핸드오프: 인트로 페이드
   ③ 카드: 리본 딜 ↔ 좌우대칭 흐트러진 스택 모으기(_card-deal 확정)
   ④ 마무리: 카드 페이드 → "8유형 중, 나의 핏은?" → '?' 카드 뒤집혀 뒷면 CTA(_card-flip 확정)
   버리는 파일. 흰선 차단(clip-path). 상단 슬라이더로 카드 타이밍 조절.
   ========================================================================== */
*{box-sizing:border-box; margin:0; padding:0}
body{min-height:100vh; background:var(--bg); color:var(--ink); font-family:var(--sans);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:24px}
.note{font-size:12.5px; color:var(--sub); text-align:center}
.replay{font-size:12px; font-weight:700; color:var(--green); background:var(--green-soft); border:1px solid var(--green-line); border-radius:20px; padding:6px 14px; cursor:pointer}
.ctrl{display:flex; flex-wrap:wrap; gap:8px 18px; justify-content:center; max-width:840px; margin:2px auto; padding:10px 16px; background:var(--surface,#fff); border:1px solid var(--line); border-radius:12px}
.ctrl label{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--sub); font-weight:700}
.ctrl input[type=range]{width:110px}
.ctrl label b{color:var(--green); font-family:var(--num,monospace); min-width:44px; text-align:right}

.stage{position:relative; width:1000px; max-width:100%; height:600px;
  --l1-at:.8s; --l1-dur:2.55s; --l2-at:3.35s;   /* l1 100%(퇴장)≈3.35s = l2 등장 직전 → 텀 없이 사라지고 뜸 */
  --stack-in:.9s; --fall-span:.5s; --copy-gap:.45s; --copy-hold:1.2s;
  --copy-at:calc(var(--fall-span) + var(--stack-in) + var(--copy-gap));   /* 낙하 다 끝난 뒤 문구 타이핑 시작 */
  --bridge:calc(var(--copy-at) + var(--copy-hold));                        /* 문구 다 보여준 뒤 펼침 시작 */
  --t-deal:1.3s; --hold:.35s; --gap-copy:.5s; --gap-flip:.7s; --t-flip:1.1s; --tape-at:5.25s; --glint-at:5.95s}
.stage::before{content:""; position:absolute; left:50%; top:-6%; width:820px; height:820px; margin-left:-410px;
  background:radial-gradient(circle at 50% 50%, var(--green-soft), transparent 62%); opacity:.6; pointer-events:none}

/* ── ① 인트로 ── */
.intro{position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); width:88%; pointer-events:none}
.intro .l{position:absolute; left:50%; top:0; transform:translate(-50%,-50%); width:100%; text-align:center;
  font-size:clamp(28px,3.6vw,46px); font-weight:800; letter-spacing:-.05em; line-height:1.3; opacity:0; white-space:nowrap}
.intro .l .lg{color:var(--green); font-weight:800; letter-spacing:-.05em}
.intro .l .lg i{display:inline-block; width:.13em; height:.13em; border-radius:1px; background:var(--green); margin-left:.05em; vertical-align:baseline}
.run #l1{animation:l1 var(--l1-dur) ease var(--l1-at) both}
@keyframes l1{0%{opacity:0}13%{opacity:1}82%{opacity:1}100%{opacity:0}}   /* 끝(≈3.9s)에 페이드아웃 = l2 페이드인과 겹침 */
.run #l2{animation:l2 .55s ease var(--l2-at) both}
@keyframes l2{from{opacity:0}to{opacity:1}}
#mlogo{display:inline-block; line-height:1; vertical-align:baseline; transform-origin:center center; will-change:transform}
#tail{transition:opacity .45s ease}

.lock{position:absolute; left:50%; top:41%; transform:translate(-50%,-50%); width:min(600px,84%); text-align:center; pointer-events:none}
.lock .lgbig{display:inline-block; font-size:clamp(38px,5vw,64px); font-weight:800; letter-spacing:-.05em; color:var(--green); line-height:1; visibility:hidden}
.lock .lgbig i{display:inline-block; width:.12em; height:.12em; border-radius:1px; background:var(--green); margin-left:.05em; vertical-align:baseline}
.lock .uline{position:relative; height:22px; margin-top:30px}
.lock .uline .ticks{position:absolute; left:0; right:0; top:2px; height:18px;
  background-image:repeating-linear-gradient(90deg, var(--line2) 0 1.6px, transparent 1.6px 15px); clip-path:inset(0 100% 0 0)}
.lock .uline .fill{position:absolute; left:0; right:0; top:9px; height:4px; border-radius:3px;
  background:linear-gradient(90deg, transparent, var(--green-mid) 46%, var(--green)); box-shadow:0 0 10px rgba(46,74,59,.3); clip-path:inset(0 100% 0 0)}
/* 펜촉 점 — 로고 옆 사각점이 줄자를 그으며 오른쪽으로, 끝점에 안착 */
.lock .uline .penmk{position:absolute; top:7px; left:0; width:8px; height:8px; margin-left:-4px; border-radius:1.5px; background:var(--green); opacity:0; box-shadow:0 0 7px rgba(46,74,59,.45)}
.run .uline .penmk{animation:tapePen .85s cubic-bezier(.35,.9,.3,1) var(--tape-at) both}
@keyframes tapePen{   /* 왼쪽에서 톡 나타나(미리 안 놓임) 오른쪽으로 쓱 그으며 이동 */
  0%{left:0; opacity:0; transform:scale(.6)}
  14%{opacity:1; transform:scale(1)}
  100%{left:100%; opacity:1; transform:scale(1)}
}
/* 끝점 스파클 ✦ — 줄자 다 채워지면 오른쪽 끝에서 별 반짝 */
.lock .uline .spark{position:absolute; top:11px; left:100%; margin-left:-2px; width:4px; height:4px; opacity:0; pointer-events:none;
  background:#fff; box-shadow:0 0 8px 2px var(--green-light,#9CC1AE)}
.lock .uline .spark::before,.lock .uline .spark::after{content:""; position:absolute; background:#fff; border-radius:2px}
.lock .uline .spark::before{inset:-6px 0; width:2px; left:1px}
.lock .uline .spark::after{inset:0 -6px; height:2px; top:1px}
.run .uline .ticks,.run .uline .fill{animation:tapeDraw .85s cubic-bezier(.35,.9,.3,1) var(--tape-at) both}
.run .uline .spark{animation:tapeSpark 1.05s ease-in-out var(--glint-at) both}
@keyframes tapeDraw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
/* 한 번 깔끔하게 반짝 — 커졌다 사라짐(여유있게) */
@keyframes tapeSpark{
  0%{opacity:0; transform:scale(0) rotate(0deg)}
  45%{opacity:1; transform:scale(1.6) rotate(45deg)}
  100%{opacity:0; transform:scale(.5) rotate(70deg)}
}

/* 핸드오프: 인트로 페이드아웃 */
.handoff .intro,.handoff .lock{opacity:0; transition:opacity .55s ease}

/* 브릿지 카피: "결과 카드가 나와요" — 카드 낙하 동안 노출 */
.midcopy{position:absolute; left:0; right:0; top:47%; text-align:center; font-size:clamp(24px,3.1vw,36px); font-weight:800; letter-spacing:-.03em; opacity:0; pointer-events:none; z-index:15; color:#fff; text-shadow:0 4px 14px rgba(0,0,0,.45); white-space:nowrap}
.midcopy .typebox{display:inline-block; text-align:left; white-space:nowrap; width:calc(var(--tw,7em) + .5em)}   /* 폭 고정(가운데 안착) → 안쪽에서 왼→오 타이핑 */
.midcopy .txt{display:inline-block; overflow:hidden; white-space:nowrap; width:0; vertical-align:bottom; line-height:1.15}
.midcopy .dot{display:inline-block; width:.3em; height:.3em; border-radius:2px; background:var(--green-light,#9CC1AE); margin-left:.1em; margin-bottom:.05em; vertical-align:bottom; opacity:0}   /* 로고 옆 사각점 = 타이핑 커서(끝을 따라감) → 마침표 */
.play .midcopy{animation:mcShow var(--copy-hold) ease var(--copy-at) both}
@keyframes mcShow{0%{opacity:0}7%{opacity:1}86%{opacity:1}100%{opacity:0}}
.play .midcopy .txt{animation:mcType calc(var(--copy-hold) * .42) steps(7,end) var(--copy-at) both}
@keyframes mcType{from{width:0}to{width:var(--tw,7em)}}
.play .midcopy .dot{animation:dotCursor calc(var(--copy-hold) * .42 + .3s) linear var(--copy-at) forwards}
@keyframes dotCursor{0%{opacity:1}10%{opacity:.12}22%{opacity:1}34%{opacity:.12}46%{opacity:1}58%{opacity:.12}70%{opacity:1}82%{opacity:.12}92%{opacity:1}100%{opacity:1}}   /* 타이핑 동안 커서처럼 깜빡 → 마침표로 안착 */

/* ── ③ 카드 덱(딜/모으기) ── */
.deck{position:absolute; inset:0; opacity:0}
.play .deck{opacity:1}
.card{position:absolute; left:calc(50% - 100px); top:180px; width:200px; height:339px;
  background:#16171b; clip-path:inset(0 round 17px); transform-origin:50% 50%; backface-visibility:hidden; z-index:calc(8 - var(--i))}
.play .card{animation:
  fallIn var(--stack-in) cubic-bezier(.5,0,.6,1) var(--fd) both,
  dealOnce var(--t-deal) cubic-bezier(.5,0,.2,1) calc(var(--bridge) + var(--d)) forwards}
@keyframes fallIn{   /* 카드가 위에서 가속해 떨어지고 살짝 튐(적당히) */
  0%{opacity:0; transform:translate(var(--fx,0), -310px) rotate(calc(var(--r) * 1.9)); animation-timing-function:cubic-bezier(.5,0,.82,.62)}
  22%{opacity:1}
  70%{transform:translate(0,0) rotate(var(--r)); animation-timing-function:cubic-bezier(.32,0,.4,1)}
  82%{transform:translate(0,-9px) rotate(var(--r)); animation-timing-function:cubic-bezier(.5,0,.7,1)}
  100%{opacity:1; transform:translate(0,0) rotate(var(--r))}
}
@keyframes dealOnce{   /* 리본으로 펼침(전체 구간에 걸쳐 펼치고 끝나면 바로 다음) */
  0%{transform:rotate(var(--r))}
  100%{transform:translate(var(--x), var(--y)) rotate(var(--rot))}
}
.play .deck{animation:deckDim .5s ease calc(var(--bridge) + var(--t-deal) + var(--hold)) forwards}
@keyframes deckDim{to{filter:brightness(.5)}}   /* 부채꼴 유지하되 어둡게 → 가운데 '?' 카드 강조 */

/* 덱 카드 내용 */
.card .hc{position:absolute; top:0; left:0; width:392px; height:664px; transform:scale(.5102); transform-origin:top left;
  color:#fff; display:flex; flex-direction:column; align-items:center; padding:26px 26px 30px; background:#16171b}
.card .hc .ctop{width:100%; display:flex; justify-content:flex-start}
.card .hc .clogo{font-size:20px; font-weight:800; letter-spacing:-.05em}
.card .hc .clogo .sq{display:inline-block; width:6px; height:6px; background:currentColor; margin-left:2px; vertical-align:baseline}
.card .hc .hcbody{flex:1; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center}
.card .hc .fig{position:relative; width:120px; height:184px; margin-bottom:6px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; transform:scale(.85)}
.card .hc .fig .head{width:32px; height:36px; margin-bottom:-3px; z-index:2; position:relative; flex:none}
.card .hc .fig .head .face{position:absolute; inset:0; border-radius:10px 10px 8px 8px; background:#ecd9c9; z-index:2;
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 7px),repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 1px,transparent 1px 7px)}
.card .hc .fig .head .cap{position:absolute; top:-3px; left:-3px; right:-3px; height:13px; border-radius:10px 10px 45% 45%; background:#2a2b30; z-index:3}
.card .hc .fig .head.female .cap{background:#9a7350}
.card .hc .fig .head .longhair{position:absolute; top:-5px; left:-7px; right:-7px; bottom:1px; background:#9a7350; border-radius:50% 50% 36% 36% / 46% 46% 30% 30%; z-index:1}
.card .hc .fig .head .ey{position:absolute; top:18px; width:4px; height:5px; border-radius:50%; background:#2a2b30; z-index:4}
.card .hc .fig .head .ey.l{left:9px} .card .hc .fig .head .ey.r{right:9px}
.card .hc .fig .body{width:120px; position:relative; flex:none;
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 8px),repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 1px,transparent 1px 8px)}
.card .hc .fig .body.straight{clip-path:polygon(38% 0,62% 0,62% 64%,64% 100%,36% 100%,38% 64%)}
.card .hc .fig .body.aline{clip-path:polygon(40% 0,60% 0,60% 30%,88% 100%,12% 100%,40% 30%)}
.card .hc .fig .body.vline{clip-path:polygon(13% 0,87% 0,64% 40%,60% 100%,40% 100%,36% 40%)}
.card .hc .fig .body.xline{clip-path:polygon(17% 0,83% 0,57% 46%,87% 100%,13% 100%,43% 46%)}
.card .hc .fig .body.balance{clip-path:polygon(33% 0,67% 0,60% 50%,67% 100%,33% 100%,40% 50%)}
.card .hc .fig .body.diamond{clip-path:polygon(37% 0,63% 0,85% 50%,61% 100%,39% 100%,15% 50%)}
.card .hc .fig .body.round{clip-path:ellipse(45% 47% at 50% 53%)}
.card .hc .fig .body.tube{clip-path:polygon(43% 0,57% 0,57% 100%,43% 100%)}
.card .hc .code{margin-top:18px; font-size:14px; font-weight:800; letter-spacing:.22em; opacity:.92}
.card .hc .word{margin-top:12px; font-size:34px; font-weight:800; letter-spacing:-.03em; line-height:1.1; text-align:center}
.card .hc .tagline{margin-top:16px; font-size:17px; line-height:1.5; opacity:.8; text-align:center; max-width:300px}

/* ── ④ 마무리: 카피 + 뒤집는 카드 ── */
.final{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; opacity:0; pointer-events:none; z-index:40}
.play .final{animation:finalFade .5s ease calc(var(--bridge) + var(--t-deal) + var(--hold) + var(--gap-copy)) both}
.final.on{pointer-events:auto}
@keyframes finalFade{from{opacity:0}to{opacity:1}}
.copy{font-size:clamp(26px,3.4vw,40px); font-weight:800; letter-spacing:-.04em; line-height:1.24; text-align:center}
.copy b{color:var(--green)}
.flip{width:230px; height:390px; perspective:1300px}
/* '?' 카드를 부채꼴에서 쑥 뽑아 올리는 액션 */
.play .flip{animation:drawUp .72s cubic-bezier(.33,.72,.28,1) calc(var(--bridge) + var(--t-deal) + var(--hold) + var(--gap-copy) + .05s) both}
@keyframes drawUp{   /* 아래서 부드럽게 뽑아 올림(스무스↔뾱 중간, 살짝만 오버슛) */
  0%{transform:translateY(205px) scale(.86)}
  72%{transform:translateY(-6px) scale(1.01)}
  100%{transform:translateY(0) scale(1)}
}
.flipin{position:relative; width:100%; height:100%; transform-style:preserve-3d}
.play .flipin{animation:doFlip var(--t-flip) cubic-bezier(.5,0,.25,1) calc(var(--bridge) + var(--t-deal) + var(--hold) + var(--gap-copy) + var(--gap-flip)) both}
@keyframes doFlip{from{transform:rotateY(0deg)}to{transform:rotateY(180deg)}}   /* 깔끔하게 씽 도는 회전 */
.face{position:absolute; inset:0; clip-path:inset(0 round 20px); backface-visibility:hidden; display:flex; flex-direction:column; color:#fff; padding:24px}
.face .logo{font-size:18px; font-weight:800; letter-spacing:-.05em}
.face .logo i{display:inline-block; width:5px; height:5px; background:currentColor; margin-left:2px; vertical-align:baseline}
.front{background:linear-gradient(160deg,#20323f,#0f1014)}
.front .q{flex:1; display:flex; align-items:center; justify-content:center; font-size:158px; font-weight:800; color:var(--green-light,#9CC1AE); text-shadow:0 0 30px rgba(156,193,174,.4)}
.back{background:radial-gradient(ellipse 80% 40% at 50% 12%, rgba(156,193,174,.16), transparent 60%), linear-gradient(160deg,#1b2a21,#0f1014); transform:rotateY(180deg)}
.back .bc{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px}
.back .bc .t{font-size:19px; font-weight:800; line-height:1.36}
.back .bc .t b{color:var(--green-light,#9CC1AE)}
.back .bc .btn{display:inline-flex; align-items:center; gap:6px; font-family:var(--sans); font-size:13px; font-weight:800;
  padding:11px 18px; border-radius:12px; background:#fff; color:#16171b; border:0; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.25)}

/* 아무 곳이나 클릭 = 건너뛰기 → 마지막 CTA 화면 즉시(부채꼴 어둡게 뒤 + '?'카드 CTA 앞면) */
.done .intro,.done .lock,.done .midcopy{display:none}
.done .deck{opacity:1}
.done .card{transform:translate(var(--x),var(--y)) rotate(var(--rot)); filter:brightness(.5)}
.done .final{opacity:1; pointer-events:auto}
.done .flip{transform:none}
.done .flipin{transform:rotateY(180deg)}
.skiphint{position:absolute; right:16px; top:14px; font-size:12.5px; font-weight:700; color:var(--sub); background:rgba(0,0,0,.045); border:1px solid var(--line); border-radius:20px; padding:6px 14px; cursor:pointer; z-index:60; pointer-events:auto}
.skiphint:hover{color:var(--ink); background:rgba(0,0,0,.09)}
.done .skiphint{display:none}
@media(prefers-reduced-motion:reduce){ *{animation:none !important} .final{opacity:1} .flipin{transform:rotateY(180deg)} .intro,.lock,.deck{opacity:0} }
</style>
</head>
<body>
<div class="note">전체 흐름 한 번 재생: <b>인트로(로고+줄자) → 딜 → 모으기 → "나의 핏은?" → 카드 뒤집기 CTA</b></div>
<button class="replay" id="replay">↻ 다시 보기</button>
<div class="ctrl" id="ctrl">
  <label>①문구1 등장 <input type="range" data-v="--l1-at" min="0" max="2" step="0.05" value="0.8"><b></b></label>
  <label>②문구2 등장 <input type="range" data-v="--l2-at" min="1" max="5" step="0.05" value="3.35"><b></b></label>
  <label>로고이동 <input type="range" data-ms="LOCK_AT" min="2000" max="7000" step="100" value="4600"><b></b></label>
  <label>핸드오프 <input type="range" data-ms="INTRO_END" min="4500" max="11000" step="100" value="7400"><b></b></label>
  <label>카드 낙하 <input type="range" data-v="--stack-in" min="0.3" max="1.5" step="0.05" value="0.9"><b></b></label>
  <label>문구 타이핑텀 <input type="range" data-v="--copy-gap" min="0" max="1" step="0.05" value="0.45"><b></b></label>
  <label>문구 유지 <input type="range" data-v="--copy-hold" min="0.6" max="3" step="0.1" value="1.2"><b></b></label>
  <label>펼침 속도 <input type="range" data-v="--t-deal" min="0.6" max="3" step="0.1" value="1.3"><b></b></label>
  <label>펼친뒤 대기 <input type="range" data-v="--hold" min="0" max="1.5" step="0.05" value="0.35"><b></b></label>
  <label>어둡게→핏? <input type="range" data-v="--gap-copy" min="0" max="1.5" step="0.05" value="0.5"><b></b></label>
  <label>뒤집기 텀 <input type="range" data-v="--gap-flip" min="0" max="2" step="0.05" value="0.7"><b></b></label>
  <label>뒤집기 속도 <input type="range" data-v="--t-flip" min="0.4" max="2" step="0.1" value="1.1"><b></b></label>
</div>

<div class="stage" id="stage">
  <div class="intro" id="intro">
    <div class="l" id="l1">당신의 체형, 아직도 모르시나요?</div>
    <div class="l" id="l2"><span class="lg" id="mlogo">Fitting<i></i></span><span class="tail" id="tail">에서 알려드립니다</span></div>
  </div>
  <div class="lock" id="lock">
    <div class="lgbig" id="lgtarget">Fitting<i></i></div>
    <div class="uline"><span class="ticks"></span><span class="fill"></span><span class="penmk"></span><span class="spark"></span></div>
  </div>
  <div class="midcopy" id="midcopy"><span class="typebox"><span class="txt">체형진단 끝</span><span class="dot"></span></span></div>
  <div class="skiphint" id="skiphint">온보딩 건너뛰기 →</div>
  <div class="deck" id="deck"></div>
  <div class="final" id="final">
    <div class="copy">8유형 중,<br><b>나의 핏</b>은?</div>
    <div class="flip"><div class="flipin">
      <div class="face front"><span class="logo">Fitting<i></i></span><div class="q">?</div></div>
      <div class="face back"><span class="logo">Fitting<i></i></span>
        <div class="bc"><div class="t">3분이면<br><b>내 FIT</b>이 나와요</div><button class="btn">진단하러가기 →</button></div></div>
    </div></div>
  </div>
</div>

<script>
(function(){
  var G='female';
  var CODES=['TRI','INV','HRG','STR','BAL','DIA','RND','TUB'];
  var ROT=['-9deg','7deg','-4deg','8deg','-7deg','3deg','-8deg','5deg'];
  var FALL=[0,.20,.07,.40,.13,.50,.28,.44];   // 카드별 낙하 딜레이(우수수, 넓게 흩어진 순서)
  var PIV=1457.7, ANG=4.4;
  var LOCK_AT=4600, INTRO_END=7400;   // 로고 이동 시점 / 인트로→카드 핸드오프 시점(ms)
  var stage=document.getElementById('stage'), deck=document.getElementById('deck'), finalEl=document.getElementById('final');
  var timers=[];

  function figHTML(silhouette, point){
    var head='<div class="head '+G+'">'+(G==='female'?'<span class="longhair"></span>':'')+
      '<span class="face"></span><span class="cap"></span><span class="ey l"></span><span class="ey r"></span></div>';
    return '<div class="fig">'+head+'<div class="body '+silhouette+'" style="background-color:'+point+'; height:150px"></div></div>';
  }
  function fitHTML(code, t){
    var g=(t.gender&&(t.gender[G]||t.gender.female))||{};
    var tag=(g.profile&&g.profile[0])||'';
    return '<div class="hc" style="background:radial-gradient(ellipse 70% 34% at 50% 11%, '+t.point+'2b, transparent 60%), linear-gradient(160deg,#191a1f,#0f1014)">'+
      '<div class="ctop"><span class="clogo">Fitting<i class="sq"></i></span></div>'+
      '<div class="hcbody">'+figHTML(t.silhouette, t.point)+
        '<div class="code" style="color:'+t.point+'">'+code+'</div>'+
        '<div class="word">'+t.name+'</div>'+
        '<div class="tagline">'+tag+'</div></div></div>';
  }
  fetch('data/bodytypes.json').then(function(r){ return r.json(); }).then(function(j){
    var map={}; j.types.forEach(function(t){ map[t.code]=t; });
    CODES.forEach(function(code,i){
      if(!map[code]) return;
      var el=document.createElement('div'); el.className='card';
      el.style.setProperty('--i', i); el.style.setProperty('--r', ROT[i]||'0deg');
      el.style.setProperty('--d', (Math.abs(i-3.5)*70).toFixed(0)+'ms');
      el.style.setProperty('--fd', (FALL[i]||0)+'s');                           // 낙하 딜레이(우수수 순서)
      el.style.setProperty('--fx', (Math.round(Math.random()*180-90))+'px');    // 낙하 시작 가로 흩뿌림
      var th=(i-3.5)*ANG*Math.PI/180;
      el.style.setProperty('--x', (PIV*Math.sin(th)).toFixed(1)+'px');
      el.style.setProperty('--y', (PIV*(1-Math.cos(th))).toFixed(1)+'px');
      el.style.setProperty('--rot', ((i-3.5)*ANG).toFixed(2)+'deg');
      el.innerHTML=fitHTML(code, map[code]); deck.appendChild(el);
    });
    run();
  }).catch(function(e){ deck.innerHTML='<p style="color:var(--sub)">데이터 로드 실패 — npm run serve로 열어주세요.</p>'; });

  function moveLogo(){
    var ml=document.getElementById('mlogo'), tg=document.getElementById('lgtarget'), tail=document.getElementById('tail');
    if(!ml||!tg) return;
    var r1=ml.getBoundingClientRect(), r2=tg.getBoundingClientRect();
    var s=r2.height/r1.height;
    var dx=(r2.left+r2.width/2)-(r1.left+r1.width/2), dy=(r2.top+r2.height/2)-(r1.top+r1.height/2);
    if(tail) tail.style.opacity='0';
    ml.style.transition='transform .82s cubic-bezier(.2,.8,.3,1)';
    ml.style.transform='translate('+dx+'px,'+dy+'px) scale('+s+')';
  }
  function resetLogo(){ var ml=document.getElementById('mlogo'), tail=document.getElementById('tail');
    if(ml){ ml.style.transition='none'; ml.style.transform='none'; } if(tail) tail.style.opacity=''; }

  function run(){
    timers.forEach(clearTimeout); timers=[];
    finalEl.classList.remove('on'); stage.classList.remove('run','handoff','play','done'); resetLogo();
    void stage.offsetWidth;
    var tapeAt=(LOCK_AT+850)/1000;                                     // 줄자는 로고 이동 뒤 따라옴
    stage.style.setProperty('--tape-at', tapeAt+'s');
    stage.style.setProperty('--glint-at', (tapeAt+0.82).toFixed(2)+'s');   // 줄자 완성 뒤 스파클
    stage.classList.add('run');                                        // ① 인트로 시작
    timers.push(setTimeout(moveLogo, LOCK_AT));                        //    로고 이동
    timers.push(setTimeout(function(){ stage.classList.add('handoff','play'); }, INTRO_END));  // ②③ 인트로 페이드 + 카드 시작
  }

  // 타이핑 폭 측정 → 커서(점)가 글자 끝을 정확히 따라가도록 --tw 설정
  function measureTw(){ var t=document.querySelector('#midcopy .txt'); if(t){ document.getElementById('midcopy').style.setProperty('--tw', Math.ceil(t.scrollWidth)+'px'); } }
  if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(measureTw); } else { setTimeout(measureTw,300); }
  measureTw();

  // 아무 곳이나 클릭 = 건너뛰기(이미 끝났으면 CTA 버튼 동작 유지)
  function skip(){ timers.forEach(clearTimeout); timers=[]; resetLogo(); stage.classList.remove('run','handoff','play'); stage.classList.add('done'); finalEl.classList.add('on'); }
  stage.addEventListener('click', function(){ if(!stage.classList.contains('done')) skip(); });

  document.getElementById('replay').addEventListener('click', run);
  stage.addEventListener('animationend', function(e){ if(e.animationName==='doFlip') finalEl.classList.add('on'); });
  [].forEach.call(document.querySelectorAll('#ctrl input[data-v]'), function(inp){
    var lab=inp.nextElementSibling;
    function apply(){ stage.style.setProperty(inp.dataset.v, inp.value+'s'); lab.textContent=(+inp.value).toFixed(2)+'s'; }
    apply(); inp.addEventListener('input', apply); inp.addEventListener('change', run);
  });
  [].forEach.call(document.querySelectorAll('#ctrl input[data-ms]'), function(inp){
    var lab=inp.nextElementSibling;
    function apply(){ if(inp.dataset.ms==='LOCK_AT') LOCK_AT=+inp.value; else INTRO_END=+inp.value; lab.textContent=(+inp.value/1000).toFixed(2)+'s'; }
    apply(); inp.addEventListener('input', apply); inp.addEventListener('change', run);
  });
})();
</script>
</body>
</html>
