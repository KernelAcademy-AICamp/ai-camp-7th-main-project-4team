<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<title>loadcard check</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/fitting.css?v=3b9569c9">
<link rel="stylesheet" href="css/diag.css?v=c86b6818">
<link rel="stylesheet" href="css/judge.css?v=33125101">
<style>body{background:#F6F6F5;font-family:'Pretendard',sans-serif;margin:0;padding:30px;}
 .box{max-width:520px;} h3{font-size:14px;color:#6E6B63;margin:0 0 10px;font-weight:700;}
 /* 애니메이션 정지(스크린샷 판독용) */
 .still .jloadcard-ring{animation:none;}</style>
</head><body>
<main class="jwrap" style="padding:0;max-width:none">
  <div class="box">
    <h3>판정 중 로딩 카드 (애니 정지 상태 · 겹침 확인용)</h3>
    <div class="still">
      <div class="jloadcard"><span class="jloadcard-in"><svg class="jloadcard-ring" viewBox="0 0 140 140" fill="none"><circle class="trk" cx="70" cy="70" r="62" stroke-width="2.5"/><path class="arc" d="M70 8a62 62 0 0 1 53.7 31" stroke-width="2.5" stroke-linecap="round"/></svg><span class="cblogo">Fit<i class="sq"></i></span></span><span class="jloadcard-tx">판정을 진행 중이에요…</span></div>
    </div>
    <h3 style="margin-top:22px">비교 — 실제 카드 뒷면(뒤집힐 카드)</h3>
    <div class="jflip"><div class="jflip-inner">
      <div class="jflip-face jflip-back"><span class="cblogo">Fit<i class="sq"></i></span></div>
      <div class="jflip-face jflip-front"></div>
    </div></div>
  </div>
</main>
</body></html>
