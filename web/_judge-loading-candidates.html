<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>판정 로딩 디자인 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/fitting.css?v=3b9569c9">
<link rel="stylesheet" href="css/diag.css?v=c86b6818">
<link rel="stylesheet" href="css/judge.css?v=33125101">
<style>
  body{background:#F6F6F5;font-family:'Pretendard',sans-serif;margin:0;padding:36px 30px 90px;color:#16140F;}
  .wrap{max-width:1000px;margin:0 auto;}
  .htop{font-size:21px;font-weight:800;letter-spacing:-.03em;}
  .hsub{margin:8px 0 30px;font-size:14px;color:#6E6B63;line-height:1.6;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  @media(max-width:760px){.grid{grid-template-columns:1fr;}}
  .case{}
  .lab{display:inline-block;font-size:12px;font-weight:800;color:#2E4A3B;background:#E7EFEA;border:1px solid #CBDDD2;padding:3px 10px;border-radius:20px;}
  .nm{font-size:15px;font-weight:800;margin:7px 0 3px;letter-spacing:-.02em;}
  .ds{font-size:13px;color:#6E6B63;margin:0 0 12px;line-height:1.5;}
  /* 결과 캔버스 흉내 */
  .stage{position:relative;height:230px;border:1px solid #E6E5E1;border-radius:18px;background:#fff;overflow:hidden;}
  .sk{padding:20px;} .sk i{display:block;height:12px;border-radius:6px;background:#EDEDEA;margin-bottom:10px;}
  .sk i.w1{width:45%} .sk i.w2{width:70%} .sk .row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:16px}
  .sk .row span{height:34px;border-radius:8px;background:#EDEDEA;display:block}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
      background:rgba(251,252,251,.82);backdrop-filter:blur(2px);}
  .tx{font-size:14px;font-weight:700;color:#6E6B63;text-align:center;line-height:1.5;}
  .tx b{display:block;color:#2E4A3B;font-weight:800;}

  /* 현재 — 기본 보더 스피너 */
  .s0{width:36px;height:36px;border-radius:50%;border:3px solid #CBDDD2;border-top-color:#2E4A3B;animation:sp .8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* A — 브랜드 링: FIT 마크 + 얇은 회전 아크 */
  .aWrap{position:relative;width:66px;height:66px;display:grid;place-items:center;}
  .aWrap svg{position:absolute;inset:0;width:66px;height:66px;animation:sp 1.15s cubic-bezier(.5,.1,.5,.9) infinite;}
  .aWrap .mk{font-size:13px;font-weight:800;letter-spacing:.08em;color:#2E4A3B;}

  /* B — 점 3개 스태거 */
  .bDots{display:flex;gap:9px;}
  .bDots i{width:9px;height:9px;border-radius:50%;background:#2E4A3B;opacity:.25;animation:bd 1.1s ease-in-out infinite;}
  .bDots i:nth-child(2){animation-delay:.16s} .bDots i:nth-child(3){animation-delay:.32s}
  @keyframes bd{0%,70%,100%{opacity:.22;transform:translateY(0)}35%{opacity:1;transform:translateY(-5px)}}

  /* C — 스켈레톤 셔머(오버레이 없이 골격이 채워지는 느낌) */
  .cShim i, .cShim span{position:relative;overflow:hidden;background:#EDEDEA !important;}
  .cShim i::after, .cShim span::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);animation:shim 1.25s infinite;}
  @keyframes shim{100%{transform:translateX(100%)}}
  .cCap{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:13.5px;font-weight:700;color:#6E6B63;}
  .cCap b{color:#2E4A3B;font-weight:800;}

  /* D — 상단 얇은 인디터미네이트 바 + 문구 */
  .dBar{position:absolute;top:0;left:0;right:0;height:3px;background:#E7EFEA;overflow:hidden;}
  .dBar i{position:absolute;left:0;top:0;bottom:0;width:38%;background:#2E4A3B;border-radius:3px;animation:db 1.15s cubic-bezier(.6,.05,.3,.95) infinite;}
  @keyframes db{0%{left:-40%}100%{left:100%}}
</style></head><body>
<div class="wrap">
  <div class="htop">판정 로딩 — 더 세련되게</div>
  <div class="hsub">오른쪽 결과 캔버스에서 <b>판정을 기다릴 때</b> / <b>다른 옷 판정하기</b>로 리셋할 때 쓰는 로딩이에요. 같은 모션을 두 곳에 공용으로 씁니다.</div>
  <div class="grid" id="out"></div>
</div>
<script>
  var SKEL='<div class="sk"><i class="w1"></i><i class="w2"></i><div class="row"><span></span><span></span><span></span><span></span></div></div>';
  var ARC='<svg viewBox="0 0 66 66" fill="none"><circle cx="33" cy="33" r="28" stroke="#E7EFEA" stroke-width="3"/>'+
          '<path d="M33 5a28 28 0 0 1 24.2 14" stroke="#2E4A3B" stroke-width="3" stroke-linecap="round"/></svg>';
  var C=[
    ['현재','<div class="ov"><div class="s0"></div><div class="tx">판정을 진행 중이에요<b>잠시만요…</b></div></div>','기본 보더 스피너','흔한 형태 · 브랜드감 약함'],
    ['A','<div class="ov"><div class="aWrap">'+ARC+'<span class="mk">FIT</span></div><div class="tx">판정을 진행 중이에요<b>잠시만요…</b></div></div>','브랜드 링 — FIT 마크 + 얇은 아크','결과 카드의 FIT 게이지와 이어짐 · 가장 브랜드다움 (추천)'],
    ['B','<div class="ov"><div class="bDots"><i></i><i></i><i></i></div><div class="tx">판정을 진행 중이에요<b>잠시만요…</b></div></div>','점 3개 스태거','가장 미니멀·가벼움 · 조용한 대기감'],
    ['C','<div class="cCap">사이즈를 <b>내 체형에 맞춰보는 중</b>이에요</div>','스켈레톤 셔머(덮개 없음)','결과 골격이 반짝이며 채워지는 느낌 · "만들어지는 중"으로 읽힘'],
    ['D','<div class="dBar"><i></i></div><div class="ov" style="background:rgba(251,252,251,.72)"><div class="tx" style="font-size:14.5px">판정을 진행 중이에요<b>잠시만요…</b></div></div>','상단 얇은 진행 바','절제된 느낌 · 스피너 없이 진행감만']
  ];
  document.getElementById('out').innerHTML=C.map(function(c){
    var shim = c[0]==='C' ? ' cShim' : '';
    return '<div class="case"><span class="lab"'+(c[0]==='현재'?' style="color:#6E6B63;background:#EDEDEA;border-color:#DAD8D2"':'')+'>'+c[0]+'</span>'+
      '<p class="nm">'+c[2]+'</p><p class="ds">'+c[3]+'</p>'+
      '<div class="stage'+shim+'">'+SKEL+c[1]+'</div></div>';
  }).join('');
</script>
</body></html>
