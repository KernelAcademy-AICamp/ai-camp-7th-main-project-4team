<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메인 아래 섹션 리디자인 — ④ 프로모 (B 확정)</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/tokens.css?v=8e429c15">
<style>
/* _home-sec4.html — ④ 프로모(B 라이트 에디토리얼 확정). 헤드라인 전부 잉크블랙. 히어로 톤(브랜드 사각점·초록 CTA) 맞춤. */
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--ink); font-family:var(--sans); letter-spacing:var(--ls-body)}
.note{background:var(--surface,#fff); border-bottom:1px solid var(--line); padding:11px 20px; font-size:12.5px; color:var(--sub); text-align:center}
.note b{color:var(--ink)}
.wrap{max-width:1160px; margin:0 auto; padding:0 28px}
.blk{padding:70px 0}

/* ── 프로모 (라이트 에디토리얼 카드) ── */
.promo{position:relative; overflow:hidden; border-radius:28px; padding:52px 56px; background:var(--surface,#fff);
  border:1px solid var(--line); box-shadow:0 22px 50px rgba(20,22,28,.06);
  display:grid; grid-template-columns:1fr auto; align-items:center; gap:44px}
.promo .rib{position:absolute; left:0; top:0; bottom:0; width:6px; background:linear-gradient(180deg,var(--green-mid),var(--green))}
.promo .eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--sub2)}
.promo .eyebrow .sq{width:7px; height:7px; border-radius:2px; background:var(--green)}
.promo h2{font-size:clamp(26px,3vw,33px); font-weight:800; letter-spacing:-.045em; line-height:1.26; margin-top:15px}
.promo p{font-size:15px; color:var(--sub); line-height:1.6; margin-top:13px; max-width:500px}
.promo .act{display:flex; flex-direction:column; gap:11px; min-width:210px}
.promo .cta{display:inline-flex; align-items:center; justify-content:center; gap:9px; background:var(--green-soft); color:var(--green); font-size:15.5px; font-weight:800; padding:16px 26px; border-radius:26px; border:none; cursor:pointer; transition:transform .16s, filter .16s}
.promo .cta:hover{transform:translateY(-2px); filter:brightness(.97)}
.promo .cta svg{width:17px; height:17px}
.promo .sub{font-size:13.5px; font-weight:700; color:var(--green); background:transparent; border:1.5px solid var(--green-line,#B9D2C4); padding:12px 20px; border-radius:24px; cursor:pointer; transition:.15s}
.promo .sub:hover{background:var(--green-soft)}

@media(max-width:820px){
  .promo{grid-template-columns:1fr; padding:38px 30px; gap:26px}
  .promo .act{min-width:0}
}
</style>
</head>
<body>
<div class="note"><b>④ 프로모 (B 확정)</b> — 라이트 카드·초록 리본·초록 CTA / 헤드라인 잉크블랙 · 실물 비교: <b>http://localhost:8000/index.html</b></div>

<section class="blk"><div class="wrap">
  <div class="promo">
    <div class="rib"></div>
    <div class="txt">
      <h2>이제 실패 없이 입어요<br>스타일리스트와 함께</h2>
      <p>진단 결과 그대로, 검증된 스타일리스트가 내 체형에 딱 맞는 코디를 찾아드려요</p>
    </div>
    <div class="act">
      <button class="cta">스타일리스트 찾기 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <button class="sub">3분 진단 먼저 하기</button>
    </div>
  </div>
</div></section>

</body>
</html>
