<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>후보 ⑤ · 상태별</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<style>
  :root{ --bg:#F6F6F5; --ink:#16140F; --sub:#6E6B63; --line:#E6E5E1; --g:#2E4A3B; --gs:#E7EFEA; --gl:#9CC1AE; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Pretendard','Apple SD Gothic Neo',sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; padding:36px 30px 90px;}
  .head{max-width:1120px; margin:0 auto 26px;}
  .head h1{font-size:22px; font-weight:800; letter-spacing:-.03em;}
  .head p{font-size:14px; color:var(--sub); margin-top:8px;}
  .stack{max-width:1120px; margin:0 auto; display:flex; flex-direction:column; gap:26px;}
  .lab{font-size:14.5px; font-weight:800; margin-bottom:10px;} .lab span{color:var(--sub); font-weight:600; font-size:13px; margin-left:6px;}

  .box{ background:#fff; border:1px solid var(--line); border-radius:18px; box-shadow:0 6px 18px rgba(20,18,16,.05); padding:12px 24px; display:flex; align-items:center; gap:15px; flex-wrap:wrap; }
  .badge{ flex:none; font-size:13px; font-weight:800; color:var(--g); background:var(--gs); border:1px solid var(--gl); padding:6px 12px; border-radius:999px; white-space:nowrap; }
  .msg{ flex:1; min-width:150px; font-size:14.5px; color:var(--sub); } .msg b{ color:var(--ink); }
  .btn{ flex:none; background:var(--ink); color:#fff; border:none; border-radius:11px; padding:9px 16px; font-size:13.5px; font-weight:800; white-space:nowrap; cursor:pointer; text-decoration:none; }
</style>
</head>
<body>
<div class="head">
  <h1>후보 ⑤ (1/2 뱃지) — 상태별 노출</h1>
  <p>완료 개수에 따라 뱃지·문구·버튼이 자동으로 바뀜 · 완성(2/2)이면 배너 자체가 사라짐</p>
</div>

<div class="stack">

  <div>
    <div class="lab">둘 다 안 함 (0벌)<span>STEP 0/2</span></div>
    <div class="box">
      <span class="badge">STEP 0 / 2</span>
      <div class="msg"><b>상의·하의를 넣으면</b> 체형이 또렷해져요</div>
      <a class="btn">진단 시작하기</a>
    </div>
  </div>

  <div>
    <div class="lab">상의만 함 (하의 남음)<span>STEP 1/2</span></div>
    <div class="box">
      <span class="badge">STEP 1 / 2</span>
      <div class="msg"><b>하의까지 하면</b> 체형이 또렷해져요</div>
      <a class="btn">하의 진단하기</a>
    </div>
  </div>

  <div>
    <div class="lab">하의만 함 (상의 남음)<span>STEP 1/2</span></div>
    <div class="box">
      <span class="badge">STEP 1 / 2</span>
      <div class="msg"><b>상의까지 하면</b> 체형이 또렷해져요</div>
      <a class="btn">상의 진단하기</a>
    </div>
  </div>

</div>
</body>
</html>
