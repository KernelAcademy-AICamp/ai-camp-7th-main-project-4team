<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>핏 카드 "한 장 뽑기 + 액션" 후보 — 순수 CSS</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/tokens.css?v=8e429c15">
<style>
/* ==========================================================================
   _pull-variants.html — 모인 스택에서 "당신의 핏은?" 한 장 뽑기 + 액션 후보 3종.
   진단 전이라 뽑히는 카드는 '?' 미스터리. 버리는 파일. clip-path로 흰선 차단.
   ========================================================================== */
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--ink); font-family:var(--sans); padding:34px 0 90px}
.wrap{max-width:1080px; margin:0 auto; padding:0 26px}
.head h1{font-size:22px; font-weight:800; letter-spacing:-.03em}
.head p{font-size:13px; color:var(--sub); margin-top:7px; line-height:1.6}
.row{margin-top:26px; display:grid; grid-template-columns:repeat(3,1fr); gap:18px}
@media(max-width:900px){ .row{grid-template-columns:1fr} }
.panel{border:1px solid var(--line); border-radius:16px; background:var(--surface,#fff); overflow:hidden; display:flex; flex-direction:column}
.lab{padding:15px 18px 0}
.lab .num{font-family:var(--num,monospace); font-size:11.5px; font-weight:800; color:var(--green); background:var(--green-soft); border-radius:6px; padding:2px 7px}
.lab b{font-size:14.5px; font-weight:800; margin-left:8px}
.lab p{font-size:12px; color:var(--sub); margin-top:6px; line-height:1.5}
.stage{position:relative; height:400px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding:0 0 22px}

/* ── 스택/카드 ── */
.deck{position:relative; width:100%; flex:1}
.card{position:absolute; left:calc(50% - 75px); bottom:8px; width:150px; height:254px;
  background:#16171b; clip-path:inset(0 round 13px); transform-origin:50% 92%; backface-visibility:hidden}
.stackcard{transform:rotate(var(--r)); z-index:var(--z)}
.myst{z-index:20; cursor:pointer}
.myst .hc{background:linear-gradient(160deg,#20323f,#0f1014) !important}

/* 카드 내용(축소) */
.card .hc{position:absolute; top:0; left:0; width:392px; height:664px; transform:scale(.38265); transform-origin:top left;
  color:#fff; display:flex; flex-direction:column; align-items:center; padding:26px 26px 30px; background:#16171b}
.card .hc .ctop{width:100%; display:flex; justify-content:flex-start}
.card .hc .clogo{font-size:20px; font-weight:800; letter-spacing:-.05em}
.card .hc .clogo .sq{display:inline-block; width:6px; height:6px; background:currentColor; margin-left:2px; vertical-align:baseline}
.card .hc .hcbody{flex:1; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center}
.card .hc .fig{position:relative; width:120px; height:184px; margin-bottom:6px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; transform:scale(.85)}
.card .hc .fig .head{width:32px; height:36px; margin-bottom:-3px; z-index:2; position:relative}
.card .hc .fig .head .face{position:absolute; inset:0; border-radius:10px 10px 8px 8px; background:#ecd9c9; z-index:2}
.card .hc .fig .head .cap{position:absolute; top:-3px; left:-3px; right:-3px; height:13px; border-radius:10px 10px 45% 45%; background:#2a2b30; z-index:3}
.card .hc .fig .head.female .cap{background:#9a7350}
.card .hc .fig .head .longhair{position:absolute; top:-5px; left:-7px; right:-7px; bottom:1px; background:#9a7350; border-radius:50% 50% 36% 36% / 46% 46% 30% 30%; z-index:1}
.card .hc .fig .head .ey{position:absolute; top:18px; width:4px; height:5px; border-radius:50%; background:#2a2b30; z-index:4}
.card .hc .fig .head .ey.l{left:9px} .card .hc .fig .head .ey.r{right:9px}
.card .hc .fig .body{width:120px; position:relative;
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 8px),repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 1px,transparent 1px 8px)}
.card .hc .fig .body.straight{clip-path:polygon(38% 0,62% 0,62% 64%,64% 100%,36% 100%,38% 64%)}
.card .hc .fig .body.aline{clip-path:polygon(40% 0,60% 0,60% 30%,88% 100%,12% 100%,40% 30%)}
.card .hc .fig .body.vline{clip-path:polygon(13% 0,87% 0,64% 40%,60% 100%,40% 100%,36% 40%)}
.card .hc .fig .body.xline{clip-path:polygon(17% 0,83% 0,57% 46%,87% 100%,13% 100%,43% 46%)}
.card .hc .fig .body.balance{clip-path:polygon(33% 0,67% 0,60% 50%,67% 100%,33% 100%,40% 50%)}
.card .hc .fig .body.diamond{clip-path:polygon(37% 0,63% 0,85% 50%,61% 100%,39% 100%,15% 50%)}
.card .hc .fig .body.round{clip-path:ellipse(45% 47% at 50% 53%)}
.card .hc .fig .body.tube{clip-path:polygon(43% 0,57% 0,57% 100%,43% 100%)}
.card .hc .code{margin-top:18px; font-size:14px; font-weight:800; letter-spacing:.22em; opacity:.92}
.card .hc .word{margin-top:12px; font-size:34px; font-weight:800; letter-spacing:-.03em; line-height:1.1; text-align:center}
.card .hc .tagline{margin-top:16px; font-size:17px; line-height:1.5; opacity:.8; text-align:center; max-width:300px}
/* 미스터리 '?' 카드 내용 */
.myst .hc .qmark{font-size:150px; font-weight:800; line-height:1; color:var(--green-light,#9CC1AE); text-shadow:0 0 26px rgba(156,193,174,.35)}
.myst .hc .word{margin-top:26px}
.myst .hc .tagline{opacity:.7}

/* ── CTA ── */
.cta{text-align:center; margin-top:4px; min-height:74px}
.cta .q{font-size:19px; font-weight:800; letter-spacing:-.02em}
.cta .q b{color:var(--green)}
.cta .btn{display:inline-flex; align-items:center; gap:7px; margin-top:12px; font-family:var(--sans); font-size:14px; font-weight:800;
  padding:11px 18px; border-radius:var(--r-btn,12px); background:var(--green-soft); color:var(--green); border:1px solid var(--green-line); cursor:pointer}
.cta .hint{font-size:12px; color:var(--sub2); margin-top:8px}

/* ── ① 자동 미스터리 뽑기 ── */
.v-auto .myst{animation:pullAuto 3.4s cubic-bezier(.4,.85,.25,1) infinite}
@keyframes pullAuto{
  0%,14%  {transform:translateY(0) rotate(-3deg)}
  42%,72% {transform:translateY(-118px) rotate(0deg)}
  94%,100%{transform:translateY(0) rotate(-3deg)}
}

/* ── ② 마우스로 직접 뽑기(참여형) ── */
.v-hover .myst{transform:translateY(0) rotate(-3deg); transition:transform .45s cubic-bezier(.3,.85,.25,1)}
.v-hover .stage:hover .myst{transform:translateY(-118px) rotate(0deg)}

/* ── ③ 셔플 후 뽑기 ── */
.v-shuffle .stackcard{animation:shuffle 4s ease-in-out infinite}
@keyframes shuffle{
  0%,100%{transform:rotate(var(--r))}
  10%    {transform:translateX(calc((var(--z) - 4) * 12px)) rotate(calc(var(--r) * 1.6))}
  22%    {transform:rotate(var(--r))}
}
.v-shuffle .myst{animation:pullShuffle 4s cubic-bezier(.4,.85,.25,1) infinite}
@keyframes pullShuffle{
  0%,30%  {transform:translateY(0) rotate(-3deg)}
  55%,82% {transform:translateY(-118px) rotate(0deg)}
  96%,100%{transform:translateY(0) rotate(-3deg)}
}

@media(prefers-reduced-motion:reduce){ .v-auto .myst,.v-shuffle .myst,.v-shuffle .stackcard{animation:none} }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>"당신의 핏은?" 한 장 뽑기 + 액션 — 후보 3</h1>
    <p>모인 스택에서 미스터리 '?' 카드를 뽑아 진단으로 유도. 마음에 드는 번호 알려주세요.</p>
  </div>
  <div class="row">
    <div class="panel v-auto">
      <div class="lab"><span class="num">1</span><b>자동 미스터리 뽑기</b><p>스택에서 '?' 카드가 저절로 쑥 뽑혀 올라와요</p></div>
      <div class="stage"><div class="deck" data-deck></div>
        <div class="cta"><div class="q"><b>당신의 핏은?</b></div><button class="btn">내 핏 찾기 →</button></div></div>
    </div>
    <div class="panel v-hover">
      <div class="lab"><span class="num">2</span><b>직접 뽑기(참여형)</b><p>카드에 마우스를 올리면 뽑혀요 — 직접 올려보세요</p></div>
      <div class="stage"><div class="deck" data-deck></div>
        <div class="cta"><div class="q"><b>당신의 핏을 뽑아보세요</b></div><div class="hint">↑ 카드에 마우스 올리기</div></div></div>
    </div>
    <div class="panel v-shuffle">
      <div class="lab"><span class="num">3</span><b>셔플 후 뽑기</b><p>카드가 촤르륵 섞인 뒤 한 장이 뽑혀 나와요</p></div>
      <div class="stage"><div class="deck" data-deck></div>
        <div class="cta"><div class="q"><b>당신의 핏은?</b></div><button class="btn">내 핏 찾기 →</button></div></div>
    </div>
  </div>
</div>

<script>
(function(){
  var G='female';
  var STACK=['TRI','INV','HRG','STR','BAL','DIA'];   // 뒤 스택(대표 6장)
  var ROT=['-8deg','5deg','-3deg','6deg','-6deg','3deg'];
  function figHTML(silhouette, point){
    var head='<div class="head '+G+'">'+(G==='female'?'<span class="longhair"></span>':'')+
      '<span class="face"></span><span class="cap"></span><span class="ey l"></span><span class="ey r"></span></div>';
    return '<div class="fig">'+head+'<div class="body '+silhouette+'" style="background-color:'+point+'; height:150px"></div></div>';
  }
  function fitHTML(code, t){
    var g=(t.gender&&(t.gender[G]||t.gender.female))||{};
    var tag=(g.profile&&g.profile[0])||'';
    return '<div class="hc" style="background:radial-gradient(ellipse 70% 34% at 50% 11%, '+t.point+'2b, transparent 60%), linear-gradient(160deg,#191a1f,#0f1014)">'+
      '<div class="ctop"><span class="clogo">Fitting<i class="sq"></i></span></div>'+
      '<div class="hcbody">'+figHTML(t.silhouette, t.point)+
        '<div class="code" style="color:'+t.point+'">'+code+'</div>'+
        '<div class="word">'+t.name+'</div>'+
        '<div class="tagline">'+tag+'</div></div></div>';
  }
  var MYST='<div class="hc"><div class="ctop"><span class="clogo">Fitting<i class="sq"></i></span></div>'+
    '<div class="hcbody"><div class="qmark">?</div><div class="word">당신의 핏은?</div><div class="tagline">진단하면 열려요</div></div></div>';

  fetch('data/bodytypes.json').then(function(r){ return r.json(); }).then(function(j){
    var map={}; j.types.forEach(function(t){ map[t.code]=t; });
    [].forEach.call(document.querySelectorAll('[data-deck]'), function(deck){
      STACK.forEach(function(code,i){
        if(!map[code]) return;
        var el=document.createElement('div'); el.className='card stackcard';
        el.style.setProperty('--r', ROT[i]||'0deg'); el.style.setProperty('--z', i);
        el.innerHTML=fitHTML(code, map[code]); deck.appendChild(el);
      });
      var m=document.createElement('div'); m.className='card myst'; m.innerHTML=MYST; deck.appendChild(m);
    });
  }).catch(function(e){ document.querySelector('.wrap').insertAdjacentHTML('beforeend','<p style="color:var(--sub);margin-top:16px">데이터 로드 실패 — npm run serve로 열어주세요.</p>'); });
})();
</script>
</body>
</html>
