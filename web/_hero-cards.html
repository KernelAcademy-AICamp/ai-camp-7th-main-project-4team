<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메인 전용 카드 8종 — 정적 보기 (버리는 파일)</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/tokens.css?v=8e429c15">
<style>
/* ==========================================================================
   _hero-cards.html — 메인 히어로 전용 다크 카드 8종을 한 화면에 정적으로 나열.
   카드 디자인 다듬기용(버리는 파일). 여기서 .hc 스타일/buildCard 내용을 손보고,
   확정되면 _home-deck.html의 동일 블록에 반영. 캐릭터(.fig) CSS는 card.css에서 가져옴.
   ========================================================================== */
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--ink); font-family:var(--sans); padding:36px 0 80px}
.wrap{max-width:1360px; margin:0 auto; padding:0 32px}
.head h1{font-size:23px; font-weight:800; letter-spacing:-.03em}
.head p{font-size:13.5px; color:var(--sub); margin-top:8px; line-height:1.6}
.grid{margin-top:30px; display:flex; flex-wrap:wrap; gap:26px; justify-content:center}

/* ── 메인 전용 다크 카드 (풀사이즈 392×664) ─────────────────────────── */
.hc{width:392px; max-width:100%; min-height:664px; border-radius:30px; overflow:hidden; color:#fff;
  display:flex; flex-direction:column; align-items:center; padding:30px 30px 34px; background:#16171b;
  box-shadow:0 20px 48px rgba(10,11,14,.28)}
.hc .ctop{width:100%; display:flex; justify-content:flex-start}
.hc .clogo{font-size:20px; font-weight:800; letter-spacing:-.05em}
.hc .clogo .sq{display:inline-block; width:6px; height:6px; background:currentColor; margin-left:2px; vertical-align:baseline}
.hc .hcbody{flex:1; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center}
.hc .fig{position:relative; width:120px; height:184px; margin-bottom:6px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(.85)} 50%{transform:translateY(-6px) scale(.85)}}
.hc .fig .head{width:32px; height:36px; margin-bottom:-3px; z-index:2; position:relative}
.hc .fig .head .face{position:absolute; inset:0; border-radius:10px 10px 8px 8px; background:#ecd9c9; z-index:2;
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 7px),repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 1px,transparent 1px 7px)}
.hc .fig .head .cap{position:absolute; top:-3px; left:-3px; right:-3px; height:13px; border-radius:10px 10px 45% 45%; background:#2a2b30; z-index:3}
.hc .fig .head.female .cap{background:#9a7350}
.hc .fig .head .longhair{position:absolute; top:-5px; left:-7px; right:-7px; bottom:1px; background:#9a7350; border-radius:50% 50% 36% 36% / 46% 46% 30% 30%; z-index:1}
.hc .fig .head .ey{position:absolute; top:18px; width:4px; height:5px; border-radius:50%; background:#2a2b30; z-index:4}
.hc .fig .head .ey.l{left:9px} .hc .fig .head .ey.r{right:9px}
.hc .fig .body{width:120px; position:relative; image-rendering:pixelated;
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 8px),repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 1px,transparent 1px 8px)}
.hc .fig .body.straight{clip-path:polygon(38% 0,62% 0,62% 64%,64% 100%,36% 100%,38% 64%)}
.hc .fig .body.aline{clip-path:polygon(40% 0,60% 0,60% 30%,88% 100%,12% 100%,40% 30%)}
.hc .fig .body.vline{clip-path:polygon(13% 0,87% 0,64% 40%,60% 100%,40% 100%,36% 40%)}
.hc .fig .body.xline{clip-path:polygon(17% 0,83% 0,57% 46%,87% 100%,13% 100%,43% 46%)}
.hc .fig .body.balance{clip-path:polygon(33% 0,67% 0,60% 50%,67% 100%,33% 100%,40% 50%)}
.hc .fig .body.diamond{clip-path:polygon(37% 0,63% 0,85% 50%,61% 100%,39% 100%,15% 50%)}
.hc .fig .body.round{clip-path:ellipse(45% 47% at 50% 53%)}
.hc .fig .body.tube{clip-path:polygon(43% 0,57% 0,57% 100%,43% 100%)}
.hc .code{margin-top:18px; font-size:14px; font-weight:800; letter-spacing:.22em; opacity:.92}
.hc .word{margin-top:12px; font-size:34px; font-weight:800; letter-spacing:-.03em; line-height:1.1; text-align:center}
.hc .tagline{margin-top:16px; font-size:17px; line-height:1.5; opacity:.8; text-align:center; max-width:300px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>메인 전용 카드 8종 (정적 보기)</h1>
    <p>히어로 촤라락에 쓸 다크 카드. 여기서 디자인 다듬고, 확정되면 <b>_home-deck.html</b>의 <code>.hc</code>·<code>buildCard()</code>에 반영해요. 성별 토글은 아래 g 값으로.</p>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
(function(){
  var G='female';   // 'male' 로 바꾸면 남성 캐릭터/문구
  var CODES=['TRI','INV','HRG','STR','BAL','DIA','RND','TUB'];
  var grid=document.getElementById('grid');

  function figHTML(silhouette, point){
    var head='<div class="head '+G+'">'+(G==='female'?'<span class="longhair"></span>':'')+
      '<span class="face"></span><span class="cap"></span><span class="ey l"></span><span class="ey r"></span></div>';
    return '<div class="fig">'+head+'<div class="body '+silhouette+'" style="background-color:'+point+'; height:150px"></div></div>';
  }
  function buildCard(code, t){
    var g=(t.gender&&(t.gender[G]||t.gender.female))||{};
    var tag=(g.profile&&g.profile[0])||'';
    var el=document.createElement('div');
    el.className='hc'; el.dataset.code=code;
    el.style.background='radial-gradient(ellipse 70% 34% at 50% 11%, '+t.point+'2b, transparent 60%), linear-gradient(160deg,#191a1f,#0f1014)';
    el.innerHTML='<div class="ctop"><span class="clogo">Fitting<i class="sq"></i></span></div>'+
      '<div class="hcbody">'+figHTML(t.silhouette, t.point)+
        '<div class="code" style="color:'+t.point+'">'+code+'</div>'+
        '<div class="word">'+t.name+'</div>'+
        '<div class="tagline">'+tag+'</div></div>';
    grid.appendChild(el);
  }
  fetch('data/bodytypes.json').then(function(r){ return r.json(); }).then(function(j){
    var map={}; j.types.forEach(function(t){ map[t.code]=t; });
    CODES.forEach(function(code){ if(map[code]) buildCard(code, map[code]); });
  }).catch(function(e){
    grid.innerHTML='<p style="color:var(--sub)">데이터 로드 실패 — 로컬 서버(npm run serve)로 열어주세요.</p>';
  });
})();
</script>
</body>
</html>
