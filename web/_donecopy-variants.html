<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>"체형진단 끝!" 문구 연출 후보 — 순수 CSS</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/tokens.css?v=8e429c15">
<style>
/* _donecopy-variants.html — 카드 떨어지기 직전 '체형진단 끝!' 문구 연출 후보 4종(무한 루프). 버리는 파일. */
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--ink); font-family:var(--sans); padding:32px 0 90px}
.wrap{max-width:1040px; margin:0 auto; padding:0 24px}
.head h1{font-size:22px; font-weight:800; letter-spacing:-.03em}
.head p{font-size:13px; color:var(--sub); margin-top:7px; line-height:1.6}
.row{margin-top:24px; display:grid; grid-template-columns:1fr 1fr; gap:18px}
@media(max-width:820px){ .row{grid-template-columns:1fr} }
.panel{border:1px solid var(--line); border-radius:16px; background:var(--surface,#fff); overflow:hidden}
.lab{padding:14px 18px 0}
.lab .num{font-family:var(--num,monospace); font-size:11.5px; font-weight:800; color:var(--green); background:var(--green-soft); border-radius:6px; padding:2px 8px}
.lab b{font-size:14.5px; font-weight:800; margin-left:8px}
.stage{position:relative; height:260px; display:flex; align-items:center; justify-content:center; overflow:hidden}
/* 뒤 다크 카드 스택(맥락) */
.bg{position:absolute; left:50%; top:50%; width:150px; height:210px; margin:-105px 0 0 -75px; z-index:0}
.bg i{position:absolute; inset:0; background:linear-gradient(160deg,#20242b,#0f1014); border-radius:14px; box-shadow:0 12px 30px rgba(10,11,14,.25)}
.bg i:nth-child(1){transform:rotate(-7deg)} .bg i:nth-child(2){transform:rotate(4deg)} .bg i:nth-child(3){transform:rotate(-1deg)}

.copy{position:relative; z-index:2; font-size:clamp(24px,3vw,32px); font-weight:800; letter-spacing:-.03em; color:#fff; text-shadow:0 4px 14px rgba(0,0,0,.45); text-align:center}

/* ① 도장 스탬프 */
.v1 .copy{animation:stampC 3s ease-out infinite}
@keyframes stampC{0%{opacity:0; transform:scale(2.3) rotate(-9deg)}9%{opacity:1; transform:scale(.9) rotate(3deg)}15%{transform:scale(1.03) rotate(-1deg)}21%{transform:scale(1) rotate(0)}80%{opacity:1}90%{opacity:0}100%{opacity:0}}

/* ② 체크 배지(칩) */
.v2 .copy{display:inline-flex; align-items:center; gap:8px; background:var(--green); color:#fff; padding:12px 20px; border-radius:999px; font-size:clamp(18px,2.3vw,24px); text-shadow:none; box-shadow:0 10px 26px rgba(46,74,59,.3); animation:badgeC 3s ease infinite}
.v2 .copy .ck{display:inline-flex; width:22px; height:22px; border-radius:50%; background:#fff; color:var(--green); align-items:center; justify-content:center; font-size:14px; font-weight:900}
@keyframes badgeC{0%{opacity:0; transform:scale(.55)}11%{opacity:1; transform:scale(1.08)}19%{transform:scale(1)}80%{opacity:1}90%{opacity:0}100%{opacity:0}}

/* ③ 결과 지향 문구 */
.v3 .copy{animation:resultC 3s ease infinite}
.v3 .copy b{color:var(--green-light,#9CC1AE)}
@keyframes resultC{0%{opacity:0; transform:translateY(16px) scale(.96)}12%{opacity:1; transform:translateY(0) scale(1)}80%{opacity:1}90%{opacity:0}100%{opacity:0}}

/* ④ 타이핑(스캔 리빌 + 커서) */
.v4 .copy{white-space:nowrap}
.v4 .copy .txt{display:inline-block; animation:typeC 3s steps(1,end) infinite}
@keyframes typeC{0%{clip-path:inset(0 100% 0 0)}26%{clip-path:inset(0 0 0 0)}80%{clip-path:inset(0 0 0 0)}90%{opacity:0}100%{opacity:0; clip-path:inset(0 100% 0 0)}}
.v4 .copy .cur{display:inline-block; width:3px; height:1em; background:#fff; margin-left:3px; vertical-align:-2px; animation:blink .5s steps(1) infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>"체형진단 끝!" 문구 연출 후보 4</h1>
    <p>카드 떨어지기 직전 순간. 뒤 다크 카드는 맥락용. 마음에 드는 번호 알려주면 _home-full에 이식할게요.</p>
  </div>
  <div class="row">
    <div class="panel v1"><div class="lab"><span class="num">1</span><b>도장 스탬프 (쾅)</b></div>
      <div class="stage"><div class="bg"><i></i><i></i><i></i></div><div class="copy">체형진단 끝!</div></div></div>
    <div class="panel v2"><div class="lab"><span class="num">2</span><b>체크 배지 (✓ 완료)</b></div>
      <div class="stage"><div class="bg"><i></i><i></i><i></i></div><div class="copy"><span class="ck">✓</span> 체형진단 완료</div></div></div>
    <div class="panel v3"><div class="lab"><span class="num">3</span><b>결과 지향 문구</b></div>
      <div class="stage"><div class="bg"><i></i><i></i><i></i></div><div class="copy"><b>결과</b>가 나왔어요!</div></div></div>
    <div class="panel v4"><div class="lab"><span class="num">4</span><b>타이핑 (또각또각)</b></div>
      <div class="stage"><div class="bg"><i></i><i></i><i></i></div><div class="copy"><span class="txt">체형진단 끝!</span><span class="cur"></span></div></div></div>
  </div>
</div>
</body>
</html>
