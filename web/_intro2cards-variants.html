<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>"체형진단 끝! → 카드 등장" 전환 후보 — 순수 CSS</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/tokens.css?v=8e429c15">
<style>
/* ==========================================================================
   _intro2cards-variants.html — '체형진단 끝!' → 카드 등장 전환 후보 4종(무한 루프).
   카피가 확실히 사라지며 카드가 임팩트 있게 등장. 버리는 파일. clip-path로 흰선 차단.
   ========================================================================== */
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--ink); font-family:var(--sans); padding:32px 0 90px}
.wrap{max-width:1040px; margin:0 auto; padding:0 24px}
.head h1{font-size:22px; font-weight:800; letter-spacing:-.03em}
.head p{font-size:13px; color:var(--sub); margin-top:7px; line-height:1.6}
.row{margin-top:24px; display:grid; grid-template-columns:1fr 1fr; gap:18px}
@media(max-width:820px){ .row{grid-template-columns:1fr} }
.panel{border:1px solid var(--line); border-radius:16px; background:var(--surface,#fff); overflow:hidden}
.lab{padding:14px 18px 0}
.lab .num{font-family:var(--num,monospace); font-size:11.5px; font-weight:800; color:var(--green); background:var(--green-soft); border-radius:6px; padding:2px 8px}
.lab b{font-size:14.5px; font-weight:800; margin-left:8px}
.lab p{font-size:12px; color:var(--sub); margin-top:6px; line-height:1.5}
.stage{position:relative; height:380px; overflow:hidden}
.midcopy{position:absolute; left:0; right:0; top:40%; text-align:center; font-size:clamp(20px,2.4vw,26px); font-weight:800; letter-spacing:-.03em; z-index:30; opacity:0}
.midcopy b{color:var(--green)}

/* ── 카드(공통) ── */
.deck{position:absolute; inset:0}
.card{position:absolute; left:calc(50% - 75px); top:calc(50% - 127px); width:150px; height:254px;
  background:#16171b; clip-path:inset(0 round 13px); transform-origin:50% 50%; backface-visibility:hidden; z-index:calc(8 - var(--i)); opacity:0}
.card .hc{position:absolute; top:0; left:0; width:392px; height:664px; transform:scale(.38265); transform-origin:top left;
  color:#fff; display:flex; flex-direction:column; align-items:center; padding:26px 26px 30px; background:#16171b}
.card .hc .ctop{width:100%; display:flex; justify-content:flex-start}
.card .hc .clogo{font-size:20px; font-weight:800; letter-spacing:-.05em}
.card .hc .clogo .sq{display:inline-block; width:6px; height:6px; background:currentColor; margin-left:2px; vertical-align:baseline}
.card .hc .hcbody{flex:1; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center}
.card .hc .fig{position:relative; width:120px; height:184px; margin-bottom:6px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; transform:scale(.85)}
.card .hc .fig .head{width:32px; height:36px; margin-bottom:-3px; z-index:2; position:relative}
.card .hc .fig .head .face{position:absolute; inset:0; border-radius:10px 10px 8px 8px; background:#ecd9c9; z-index:2}
.card .hc .fig .head .cap{position:absolute; top:-3px; left:-3px; right:-3px; height:13px; border-radius:10px 10px 45% 45%; background:#2a2b30; z-index:3}
.card .hc .fig .head.female .cap{background:#9a7350}
.card .hc .fig .head .longhair{position:absolute; top:-5px; left:-7px; right:-7px; bottom:1px; background:#9a7350; border-radius:50% 50% 36% 36% / 46% 46% 30% 30%; z-index:1}
.card .hc .fig .head .ey{position:absolute; top:18px; width:4px; height:5px; border-radius:50%; background:#2a2b30; z-index:4}
.card .hc .fig .head .ey.l{left:9px} .card .hc .fig .head .ey.r{right:9px}
.card .hc .fig .body{width:120px; position:relative}
.card .hc .fig .body.straight{clip-path:polygon(38% 0,62% 0,62% 64%,64% 100%,36% 100%,38% 64%)}
.card .hc .fig .body.aline{clip-path:polygon(40% 0,60% 0,60% 30%,88% 100%,12% 100%,40% 30%)}
.card .hc .fig .body.vline{clip-path:polygon(13% 0,87% 0,64% 40%,60% 100%,40% 100%,36% 40%)}
.card .hc .fig .body.xline{clip-path:polygon(17% 0,83% 0,57% 46%,87% 100%,13% 100%,43% 46%)}
.card .hc .fig .body.balance{clip-path:polygon(33% 0,67% 0,60% 50%,67% 100%,33% 100%,40% 50%)}
.card .hc .fig .body.diamond{clip-path:polygon(37% 0,63% 0,85% 50%,61% 100%,39% 100%,15% 50%)}
.card .hc .fig .body.round{clip-path:ellipse(45% 47% at 50% 53%)}
.card .hc .fig .body.tube{clip-path:polygon(43% 0,57% 0,57% 100%,43% 100%)}
.card .hc .code{margin-top:16px; font-size:14px; font-weight:800; letter-spacing:.22em; opacity:.92}
.card .hc .word{margin-top:10px; font-size:32px; font-weight:800; letter-spacing:-.03em; text-align:center}

/* ── ① 버스트: 카피가 팍 터지며 카드가 사방으로 튕겨나갔다 모임 ── */
.v1 .midcopy{animation:v1copy 4.4s ease infinite}
@keyframes v1copy{0%{opacity:0;transform:scale(.7)}7%{opacity:1;transform:scale(1.08)}14%{transform:scale(1)}20%{opacity:1}27%{opacity:0;transform:scale(1.5)}100%{opacity:0}}
.v1 .card{animation:v1card 4.4s cubic-bezier(.3,.75,.3,1) infinite}
@keyframes v1card{
  0%,20%{opacity:0; transform:rotate(0) scale(.5)}
  27%{opacity:1; transform:translate(var(--bx), var(--by)) rotate(var(--br)) scale(1)}
  48%{opacity:1; transform:rotate(var(--r))}
  82%{opacity:1; transform:rotate(var(--r))}
  90%,100%{opacity:0; transform:rotate(var(--r)) scale(.94)}
}

/* ② 슬램: 카피 훅 사라지고 카드 한 뭉치가 쾅 떨어져 튕김 ── */
.v2 .midcopy{animation:v2copy 4.4s ease infinite}
@keyframes v2copy{0%{opacity:0}7%{opacity:1}17%{opacity:1}23%{opacity:0}100%{opacity:0}}
.v2 .card{animation:v2card 4.4s cubic-bezier(.5,0,.35,1) infinite}
@keyframes v2card{
  0%,24%{opacity:0; transform:translateY(-300px) rotate(var(--r))}
  31%{opacity:1; transform:translateY(0) rotate(var(--r))}
  35%{transform:translateY(-20px) rotate(var(--r))}
  40%{transform:translateY(0) rotate(var(--r))}
  82%{opacity:1}90%,100%{opacity:0}
}

/* ③ 딜링: 카피 사라지고 카드가 옆에서 한 장씩 탁탁탁 날아와 스택 ── */
.v3 .midcopy{animation:v2copy 4.4s ease infinite}
.v3 .card{animation:v3card 4.4s cubic-bezier(.15,.85,.3,1) infinite; animation-delay:calc(0.9s + var(--i) * 90ms)}
@keyframes v3card{
  0%{opacity:0; transform:translate(-380px,-90px) rotate(-46deg)}
  6%{opacity:1}
  14%{opacity:1; transform:translate(0,0) rotate(var(--r))}
  76%{opacity:1; transform:translate(0,0) rotate(var(--r))}
  86%,100%{opacity:0; transform:translate(0,0) rotate(var(--r))}
}

/* ④ 줌 스택: 카피 자리에서 카드 뭉치가 작게→확 커지며 등장(펀치) ── */
.v4 .midcopy{animation:v2copy 4.4s ease infinite}
.v4 .card{animation:v4card 4.4s cubic-bezier(.34,1.56,.5,1) infinite}
@keyframes v4card{
  0%,24%{opacity:0; transform:rotate(var(--r)) scale(.15)}
  36%{opacity:1; transform:rotate(var(--r)) scale(1.08)}
  44%{transform:rotate(var(--r)) scale(1)}
  82%{opacity:1}90%,100%{opacity:0}
}

@media(prefers-reduced-motion:reduce){ .card,.midcopy{animation:none !important} }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>"체형진단 끝! → 카드 등장" 전환 후보 4</h1>
    <p>카피가 확실히 사라지며 카드가 임팩트 있게 등장. 각 패널 무한 루프. 마음에 드는 번호 알려주면 그걸로 히어로에 이식할게요.</p>
  </div>
  <div class="row">
    <div class="panel v1">
      <div class="lab"><span class="num">1</span><b>버스트 (터짐)</b><p>카피가 팍 터지며 카드가 사방으로 튕겨나갔다 모임</p></div>
      <div class="stage"><div class="midcopy"><b>체형진단 끝!</b></div><div class="deck" data-deck></div></div>
    </div>
    <div class="panel v2">
      <div class="lab"><span class="num">2</span><b>슬램 (쾅)</b><p>카피 훅 사라지고 카드 한 뭉치가 쾅 떨어져 튕김</p></div>
      <div class="stage"><div class="midcopy"><b>체형진단 끝!</b></div><div class="deck" data-deck></div></div>
    </div>
    <div class="panel v3">
      <div class="lab"><span class="num">3</span><b>딜링 (탁탁탁)</b><p>카드가 옆에서 한 장씩 탁탁탁 날아와 스택</p></div>
      <div class="stage"><div class="midcopy"><b>체형진단 끝!</b></div><div class="deck" data-deck></div></div>
    </div>
    <div class="panel v4">
      <div class="lab"><span class="num">4</span><b>줌 스택 (확)</b><p>카드 뭉치가 작게→확 커지며 펀치 있게 등장</p></div>
      <div class="stage"><div class="midcopy"><b>체형진단 끝!</b></div><div class="deck" data-deck></div></div>
    </div>
  </div>
</div>
<script>
(function(){
  var G='female';
  var CODES=['TRI','INV','HRG','STR','BAL','DIA','RND','TUB'];
  var ROT=['-9deg','7deg','-4deg','8deg','-7deg','3deg','-8deg','5deg'];
  function figHTML(silhouette, point){
    var head='<div class="head '+G+'">'+(G==='female'?'<span class="longhair"></span>':'')+
      '<span class="face"></span><span class="cap"></span><span class="ey l"></span><span class="ey r"></span></div>';
    return '<div class="fig">'+head+'<div class="body '+silhouette+'" style="background-color:'+point+'; height:150px"></div></div>';
  }
  function fitHTML(code, t){
    return '<div class="hc" style="background:radial-gradient(ellipse 70% 34% at 50% 11%, '+t.point+'2b, transparent 60%), linear-gradient(160deg,#191a1f,#0f1014)">'+
      '<div class="ctop"><span class="clogo">Fitting<i class="sq"></i></span></div>'+
      '<div class="hcbody">'+figHTML(t.silhouette, t.point)+
        '<div class="code" style="color:'+t.point+'">'+code+'</div>'+
        '<div class="word">'+t.name+'</div></div></div>';
  }
  fetch('data/bodytypes.json').then(function(r){ return r.json(); }).then(function(j){
    var map={}; j.types.forEach(function(t){ map[t.code]=t; });
    [].forEach.call(document.querySelectorAll('[data-deck]'), function(deck){
      CODES.forEach(function(code,i){
        if(!map[code]) return;
        var el=document.createElement('div'); el.className='card';
        el.style.setProperty('--i', i); el.style.setProperty('--r', ROT[i]||'0deg');
        el.style.setProperty('--bx', (Math.round(Math.random()*300-150))+'px');   // 버스트 흩어짐
        el.style.setProperty('--by', (Math.round(Math.random()*220-110))+'px');
        el.style.setProperty('--br', (Math.round(Math.random()*80-40))+'deg');
        el.innerHTML=fitHTML(code, map[code]); deck.appendChild(el);
      });
    });
  }).catch(function(e){ document.querySelector('.wrap').insertAdjacentHTML('beforeend','<p style="color:var(--sub);margin-top:16px">데이터 로드 실패 — npm run serve로 열어주세요.</p>'); });
})();
</script>
</body>
</html>
