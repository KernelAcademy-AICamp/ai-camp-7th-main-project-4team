<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>줄자 완성 '빛나는' 연출 후보 — 순수 CSS</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/tokens.css?v=8e429c15">
<style>
/* _tapeglint-variants.html — 줄자 다 채워진 순간 '빛나는' 연출 후보 5종(무한 루프). 버리는 파일. */
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--ink); font-family:var(--sans); padding:34px 0 90px}
.wrap{max-width:820px; margin:0 auto; padding:0 28px}
.head h1{font-size:22px; font-weight:800; letter-spacing:-.03em}
.head p{font-size:13px; color:var(--sub); margin-top:7px; line-height:1.6}
.grid{margin-top:26px; display:flex; flex-direction:column; gap:14px}
.card{background:var(--surface,#fff); border:1px solid var(--line); border-radius:16px; padding:20px 26px 30px}
.lab{display:flex; align-items:baseline; gap:10px; margin-bottom:6px}
.lab .num{font-family:var(--num,monospace); font-size:12px; font-weight:800; color:var(--green); background:var(--green-soft); border-radius:6px; padding:2px 7px}
.lab b{font-size:15px; font-weight:800}
.lab span{font-size:12.5px; color:var(--sub)}

/* 줄자(딥그린 선 + 회색 눈금), 왼→오 채워지고 끝나면 연출 → 루프 */
.tape{position:relative; height:22px; margin-top:16px}
.tape .ticks{position:absolute; left:0; right:0; top:2px; height:18px;
  background-image:repeating-linear-gradient(90deg, var(--line2) 0 1.6px, transparent 1.6px 15px); clip-path:inset(0 100% 0 0); animation:tdraw 3.4s ease infinite}
.tape .fill{position:absolute; left:0; right:0; top:9px; height:4px; border-radius:3px;
  background:linear-gradient(90deg, transparent, var(--green-mid) 46%, var(--green)); clip-path:inset(0 100% 0 0); animation:tdraw 3.4s ease infinite}
@keyframes tdraw{0%{clip-path:inset(0 100% 0 0)}32%{clip-path:inset(0 0 0 0)}86%{clip-path:inset(0 0 0 0)}94%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0 100% 0 0)}}

/* ① 흰 광택 스윽(현재) */
.v1 .glint{position:absolute; top:9px; left:-60px; width:60px; height:4px; border-radius:3px; opacity:0;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.95), transparent); animation:v1 3.4s ease infinite}
@keyframes v1{0%,32%{left:-60px;opacity:0}37%{opacity:1}52%{left:100%;opacity:1}60%{opacity:0}100%{opacity:0}}

/* ② 글로우 펄스(선 전체가 확 빛났다 가라앉음) */
.v2 .fill{animation:tdraw 3.4s ease infinite, v2glow 3.4s ease infinite}
@keyframes v2glow{0%,32%{box-shadow:0 0 5px rgba(46,74,59,.25)}40%{box-shadow:0 0 22px 5px rgba(46,74,59,.75), 0 0 40px 10px rgba(46,74,59,.35)}56%{box-shadow:0 0 5px rgba(46,74,59,.25)}100%{box-shadow:0 0 5px rgba(46,74,59,.25)}}

/* ③ 끝점 스파클(오른쪽 끝에서 반짝 ✦) */
.v3 .spark{position:absolute; top:11px; left:100%; margin-left:-2px; width:4px; height:4px; opacity:0;
  background:#fff; box-shadow:0 0 8px 2px var(--green-light,#9CC1AE); animation:v3 3.4s ease infinite}
.v3 .spark::before,.v3 .spark::after{content:""; position:absolute; inset:-6px 0; background:linear-gradient(#fff,#fff); width:2px; left:1px; border-radius:2px}
.v3 .spark::after{inset:0 -6px; height:2px; width:auto; top:1px}
@keyframes v3{0%,32%{opacity:0; transform:scale(0) rotate(0)}40%{opacity:1; transform:scale(1.6) rotate(45deg)}52%{opacity:0; transform:scale(.6) rotate(90deg)}100%{opacity:0}}

/* ④ 끝점 플래시(오른쪽 끝에서 팟! 하고 번짐) */
.v4 .flash{position:absolute; top:11px; left:100%; margin-left:-6px; width:12px; height:12px; margin-top:-4px; border-radius:50%; opacity:0;
  background:radial-gradient(circle, #fff 0 30%, var(--green-light,#9CC1AE) 55%, transparent 72%); animation:v4 3.4s ease infinite}
@keyframes v4{0%,32%{opacity:0; transform:scale(.2)}38%{opacity:1; transform:scale(2.6)}50%{opacity:0; transform:scale(3.4)}100%{opacity:0}}

/* ⑤ 컬러 플래시(선이 밝은 초록으로 번쩍) */
.v5 .fill{animation:tdraw 3.4s ease infinite, v5flash 3.4s ease infinite}
@keyframes v5flash{0%,33%{filter:brightness(1)}39%{filter:brightness(2.4) saturate(1.4)}54%{filter:brightness(1)}100%{filter:brightness(1)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>줄자 완성 '빛나는' 연출 후보 5</h1>
    <p>줄자 다 채워지는 순간의 반짝임. 딥그린 선 + 회색 눈금 기준. 각 무한 루프. 마음에 드는 번호 알려주세요.</p>
  </div>
  <div class="grid">
    <div class="card"><div class="lab"><span class="num">1</span><b>흰 광택 스윽</b><span>지금 방식 — 흰빛이 선 위로 한 번 지나감</span></div>
      <div class="tape v1"><div class="ticks"></div><div class="fill"></div><div class="glint"></div></div></div>
    <div class="card"><div class="lab"><span class="num">2</span><b>글로우 펄스</b><span>선 전체가 확 빛났다 가라앉음(딥그린 글로우)</span></div>
      <div class="tape v2"><div class="ticks"></div><div class="fill"></div></div></div>
    <div class="card"><div class="lab"><span class="num">3</span><b>끝점 스파클 ✦</b><span>오른쪽 끝에서 별 반짝</span></div>
      <div class="tape v3"><div class="ticks"></div><div class="fill"></div><div class="spark"></div></div></div>
    <div class="card"><div class="lab"><span class="num">4</span><b>끝점 플래시</b><span>오른쪽 끝에서 팟! 하고 빛이 번짐</span></div>
      <div class="tape v4"><div class="ticks"></div><div class="fill"></div><div class="flash"></div></div></div>
    <div class="card"><div class="lab"><span class="num">5</span><b>컬러 플래시</b><span>선이 밝은 초록으로 한 번 번쩍</span></div>
      <div class="tape v5"><div class="ticks"></div><div class="fill"></div></div></div>
  </div>
</div>
</body>
</html>
