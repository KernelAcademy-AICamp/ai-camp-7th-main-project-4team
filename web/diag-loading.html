<div class="flow">
  <div class="dstepc">
    <div class="dnode done"><span class="ddot">1</span><span class="dlbl">기본정보</span></div>
    <div class="dconn solid done"></div>

    <div class="dnode now"><span class="ddot">3</span><span class="dlbl">진단중</span></div>

  <div class="loading-wrap">
    <!-- 동그란 Fit 로딩(소희 · judge 화면에서 이식) — 스피너 링 + Fit 로고. 진행률 로직(diag-loading.js)은 단계 체크로 유지. -->
    <div class="dl-mk"><svg class="dl-ring" viewBox="0 0 140 140" fill="none"><circle class="trk" cx="70" cy="70" r="62" stroke-width="2.5"/><path class="arc" d="M70 8a62 62 0 0 1 53.7 31" stroke-width="2.5" stroke-linecap="round"/></svg><span class="dl-lg">Fit<i class="sq"></i></span></div>

    <p class="lsub" id="lsub">입어본 옷을 바탕으로 체형과 선호핏을 분석하고 있어요</p>
    <ul class="load-steps" id="steps"></ul>
  </div>
