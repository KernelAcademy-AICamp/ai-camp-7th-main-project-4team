<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>후보 · VS(B) 색 조합</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<style>
  :root{ --tp:#ff9ec5; --ok:#bfe0cd; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Pretendard','Apple SD Gothic Neo',sans-serif; background:#EEEDEA; color:#16140F; -webkit-font-smoothing:antialiased; padding:38px 24px 90px;}
  .head{max-width:1200px; margin:0 auto 30px;}
  .head h1{font-size:24px; font-weight:800; letter-spacing:-.03em;}
  .head p{font-size:14.5px; color:#6E6B63; margin-top:8px; line-height:1.6;}
  .gallery{max-width:1200px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:40px 32px; justify-items:center;}
  .cand{width:340px;}
  .cand .lab{margin-bottom:12px;}
  .cand .lab b{font-size:16px; font-weight:800;}
  .cand .lab span{display:block; font-size:13px; color:#6E6B63; line-height:1.5; margin-top:4px;}

  .frag{border-radius:22px; padding:30px 24px; color:#fff; background:linear-gradient(165deg,#191a1f,#0f1014); box-shadow:0 16px 40px rgba(10,11,14,.28);}
  .ic{width:15px; height:15px; vertical-align:-2px;}

  .duel{display:grid; grid-template-columns:1fr auto 1fr; align-items:center;}
  .side{text-align:center; padding:6px;}
  .sh{display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:800; margin-bottom:14px;}
  .side.no .sh{color:rgba(255,255,255,.55);}
  .it{font-size:15px; font-weight:800; line-height:1.35; padding:8px 0;}
  .side.no .it{color:rgba(255,255,255,.6);}
  .vs{font-size:13px; font-weight:900; letter-spacing:.04em; padding:0 14px; position:relative;}
  .vs::before,.vs::after{content:""; position:absolute; left:50%; width:1px; background:rgba(255,255,255,.12); height:30px;}
  .vs::before{top:-42px;} .vs::after{bottom:-42px;}

  /* 잘맞 색 */
  .green .side.ok .sh{color:var(--ok);}
  .pink  .side.ok .sh{color:var(--tp);}
  /* VS 색 */
  .vs-pink .vs{color:var(--tp);}
  .vs-white .vs{color:rgba(255,255,255,.72);}
  .vs-badge .vs{color:rgba(255,255,255,.72); padding:0; }
  .vs-badge .vs b{display:inline-block; width:34px; height:34px; border-radius:50%; border:1.5px solid rgba(255,255,255,.25); line-height:31px; font-weight:900;}
  .vs-badge .vs::before{top:-40px;} .vs-badge .vs::after{bottom:-40px;}
</style>
</head>
<body>

<div class="head">
  <h1>VS(B) — 잘맞 색 & VS 색 조합</h1>
  <p>잘맞을 유형카드 핑크로 쓰면? · 그럼 VS는 핑크 말고 중립으로 빼야 안 겹쳐요</p>
</div>

<div class="gallery">

  <!-- 기존 참고 -->
  <div class="cand">
    <div class="lab"><b>기존 (참고)</b><span>잘맞 초록 · VS 핑크</span></div>
    <div class="frag green vs-pink">
      <div class="duel">
        <div class="side ok"><div class="sh"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>잘맞</div><div class="it">A라인 원피스</div><div class="it">어깨 드러내기</div></div>
        <div class="vs">VS</div>
        <div class="side no"><div class="sh"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>피할</div><div class="it">허리 꽉 끼는 옷</div><div class="it">짧은 상의</div></div>
      </div>
    </div>
  </div>

  <!-- ① 잘맞 핑크 · VS 흰색 -->
  <div class="cand">
    <div class="lab"><b>① 잘맞 핑크 · VS 흰색</b><span>유형색으로 통일 · VS는 옅은 흰색</span></div>
    <div class="frag pink vs-white">
      <div class="duel">
        <div class="side ok"><div class="sh"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>잘맞</div><div class="it">A라인 원피스</div><div class="it">어깨 드러내기</div></div>
        <div class="vs">VS</div>
        <div class="side no"><div class="sh"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>피할</div><div class="it">허리 꽉 끼는 옷</div><div class="it">짧은 상의</div></div>
      </div>
    </div>
  </div>

  <!-- ② 잘맞 핑크 · VS 동그라미 배지 -->
  <div class="cand">
    <div class="lab"><b>② 잘맞 핑크 · VS 배지</b><span>VS를 옅은 원 안에 · 대결 느낌 ↑</span></div>
    <div class="frag pink vs-badge">
      <div class="duel">
        <div class="side ok"><div class="sh"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>잘맞</div><div class="it">A라인 원피스</div><div class="it">어깨 드러내기</div></div>
        <div class="vs"><b>VS</b></div>
        <div class="side no"><div class="sh"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>피할</div><div class="it">허리 꽉 끼는 옷</div><div class="it">짧은 상의</div></div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
