<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>8유형 카드 — 태그 적용 확인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<style>
  body{background:#F6F6F5;font-family:'Pretendard',sans-serif;margin:0;padding:26px;}
  h3{font-size:16px;font-weight:800;margin:0 0 16px;letter-spacing:-.02em;}
  .g{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  @media(max-width:1100px){.g{grid-template-columns:repeat(2,1fr);}}
  .cell{background:#fff;border:1px solid #E6E5E1;border-radius:14px;padding:8px;}
  .cell b{display:block;font-size:12px;color:#6E6B63;text-align:center;margin:4px 0 8px;font-weight:700;}
  iframe{width:100%;height:520px;border:0;border-radius:12px;display:block;background:#0f1014;}
</style></head><body>
<h3>8유형 카드 — 해시태그 적용(라안: 이름↔설명 사이) 일괄 확인</h3>
<div class="g" id="g"></div>
<script>
  var T=[['STR','시크 스트레이트'],['TRI','소프트 A라인'],['INV','모던 V라인'],['HRG','엘레강스 X라인'],
         ['BAL','이지 밸런스'],['DIA','소프트 다이아'],['RND','코지 라운드'],['TUB','슬릭 라인']];
  document.getElementById('g').innerHTML=T.map(function(t){
    return '<div class="cell"><b>'+t[0]+' · '+t[1]+'</b><iframe src="card.html?type='+t[0]+'&compact=1"></iframe></div>';
  }).join('');
</script>
</body></html>
