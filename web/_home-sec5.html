<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메인 아래 섹션 리디자인 — ⑤ 아웃트로</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/tokens.css?v=8e429c15">
<style>
/* _home-sec5.html — ⑤ 아웃트로 리디자인 시안(버리는 파일). 히어로와 북엔드(로고+줄자). 줄자 정밀화 + 선두=브랜드 사각점. */
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--ink); font-family:var(--sans); letter-spacing:var(--ls-body)}
.note{background:var(--surface,#fff); border-bottom:1px solid var(--line); padding:11px 20px; font-size:12.5px; color:var(--sub); text-align:center}
.note b{color:var(--ink)}
.wrap{max-width:1160px; margin:0 auto; padding:0 28px}
.replay{position:fixed; right:16px; bottom:16px; z-index:9; font-size:12.5px; font-weight:800; color:var(--sub); background:#fff; border:1px solid var(--line); padding:9px 15px; border-radius:20px; cursor:pointer}

/* ── 아웃트로 ── */
.outro{padding:100px 0 56px; text-align:center; border-top:1px solid var(--line)}
.outro .eb{display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--sub2); opacity:0}
.outro.in .eb{opacity:1; transition:opacity .6s ease .1s}
.outro .eb .sq{width:6px; height:6px; border-radius:2px; background:var(--green)}

.outro .ologo{display:inline-block; font-size:46px; font-weight:800; letter-spacing:-.05em; color:var(--green); margin-top:18px; opacity:0; transition:opacity .6s ease .28s}
.outro.in .ologo{opacity:1; animation:twinkle 1.1s ease 1.95s 1}
.outro .ologo i{display:inline-block; width:9px; height:9px; border-radius:2px; background:var(--green); margin-left:4px; vertical-align:baseline}
@keyframes twinkle{0%{text-shadow:0 0 0 rgba(46,74,59,0); filter:brightness(1)}30%{text-shadow:0 0 22px rgba(46,74,59,.55); filter:brightness(1.22)}60%{text-shadow:0 0 9px rgba(46,74,59,.28); filter:brightness(1.06)}100%{text-shadow:0 0 0 rgba(46,74,59,0); filter:brightness(1)}}

.outro .otag{font-size:15px; color:var(--sub); font-weight:600; margin-top:15px; opacity:0}
.outro.in .otag{opacity:1; transition:opacity .6s ease .45s}

/* 정밀 줄자 — 가는 중심선 + 고운 눈금 + 잉크 채움 + 선두 브랜드 사각점 */
.otape{position:relative; height:34px; max-width:620px; margin:44px auto 0}
.otape .rail{position:absolute; left:0; right:0; top:50%; margin-top:-.5px; height:1px; background:var(--line2)}
.otape .ticks{position:absolute; left:0; right:0; top:50%; margin-top:-7px; height:14px;
  background:repeating-linear-gradient(90deg, var(--line2) 0 1px, transparent 1px 13px); opacity:0}
.outro.in .otape .ticks{opacity:1; transition:opacity .9s ease .6s}
.otape .draw{position:absolute; left:0; top:50%; margin-top:-1.5px; height:3px; border-radius:3px; background:var(--ink); width:0}
.outro.in .otape .draw{width:100%; transition:width 1.35s cubic-bezier(.4,.85,.25,1) .55s}
.otape .mk{position:absolute; top:50%; left:0; width:11px; height:11px; margin:-5.5px 0 0 -5.5px; border-radius:2.5px;
  background:var(--green); box-shadow:0 2px 8px rgba(46,74,59,.4); opacity:0}   /* 브랜드 사각 = 로고 점과 동일 */
.outro.in .otape .mk{left:100%; opacity:1; transition:left 1.35s cubic-bezier(.4,.85,.25,1) .55s, opacity .3s ease .55s}

.outro .foot{font-size:12.5px; color:var(--sub2); margin-top:64px; opacity:0}
.outro.in .foot{opacity:1; transition:opacity .6s ease .9s}

@media(max-width:820px){ .outro{padding:76px 0 48px} .outro .ologo{font-size:38px} .otape{max-width:none; margin-left:20px; margin-right:20px} }
</style>
</head>
<body>
<div class="note"><b>⑤ 아웃트로</b> — 히어로와 북엔드(로고+줄자), 줄자 정밀화·선두=브랜드 사각점 · 실물 비교: <b>http://localhost:8000/index.html</b></div>
<button class="replay" onclick="play()">↺ 다시 재생</button>

<div style="height:30vh"></div>

<section class="outro" id="outro">
  <div class="ologo">Fitting<i></i></div>
  <div class="otag">착용 경험을 사이즈로, 그리고 스타일링까지</div>
  <div class="otape"><div class="rail"></div><div class="ticks"></div><div class="draw"></div><div class="mk"></div></div>
  <div class="foot">© 2026 Fitting</div>
</section>

<div style="height:30vh"></div>

<script>
  var outro=document.getElementById('outro');
  function play(){ outro.classList.remove('in'); void outro.offsetWidth; outro.classList.add('in'); }
  new IntersectionObserver(function(en){ en.forEach(function(x){ if(x.isIntersecting){ outro.classList.add('in'); } else { outro.classList.remove('in'); } }); },{threshold:.5}).observe(outro);
</script>
</body>
</html>
