<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>스타일리스트 웨이트리스트 (미리보기)</title>
<link rel="stylesheet" href="css/tokens.css?v=8e429c15">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/index.css?v=809c31cd">
<style>
  body{background:var(--bg);font-family:'Pretendard',sans-serif;color:var(--ink);margin:0;-webkit-font-smoothing:antialiased;}
  .pv-note{max-width:680px;margin:24px auto 0;padding:0 30px;font-size:12.5px;color:var(--sub2);}
  .chip.on{background:var(--green-soft);border-color:var(--green);color:var(--green);}
</style>
</head><body>
<div class="pv-note">※ 운영(버셀)에서 스타일리스트 찾기 진입 시 뜨는 화면 · 현재 구성 그대로</div>
<div class="wrap">
  <section class="page" style="display:block">
    <div id="stylistWaitlist">
      <div class="reqpage">
        <h1>스타일리스트 매칭, 곧 만나요</h1>
        <p class="lead" style="line-height:1.65">진단 결과에 맞는 코디를<br><b style="color:var(--ink)">나에게 맞는 스타일리스트</b>가 제안해드려요<br>오픈 알림을 신청하고 <b style="color:var(--ink)">원하는 스타일</b>을 알려주세요</p>
        <div style="font-size:15px;font-weight:800;color:var(--ink);margin:44px 0 14px;display:flex;gap:7px;align-items:center">어떤 도움이 필요하세요? <span style="font-size:12px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:5px;padding:1px 6px">선택</span></div>
        <div id="wlSvc" style="display:flex;flex-wrap:wrap;gap:7px">
          <button type="button" class="chip" onclick="pick(this)">온라인 코디 추천</button>
          <button type="button" class="chip" onclick="pick(this)">쇼핑 동행</button>
          <button type="button" class="chip" onclick="pick(this)">이미지 컨설팅</button>
          <button type="button" class="chip" onclick="pick(this)">아직 모르겠어요</button>
        </div>
        <div style="font-size:15px;font-weight:800;color:var(--ink);margin:28px 0 14px;display:flex;gap:7px;align-items:center">어떤 상황이 많나요? <span style="font-size:12px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:5px;padding:1px 6px">선택</span></div>
        <div id="wlOcc" style="display:flex;flex-wrap:wrap;gap:7px">
          <button type="button" class="chip" onclick="pick(this)">데일리</button>
          <button type="button" class="chip" onclick="pick(this)">출근·면접</button>
          <button type="button" class="chip" onclick="pick(this)">소개팅·데이트</button>
          <button type="button" class="chip" onclick="pick(this)">행사·하객</button>
          <button type="button" class="chip" onclick="pick(this)">여행</button>
        </div>
        <div style="font-size:15px;font-weight:800;color:var(--ink);margin:30px 0 14px">이메일 주소</div>
        <input type="email" class="inp" placeholder="오픈 시 메일로 알림을 보내드려요" style="width:100%">
        <button class="btn full" style="margin-top:16px">오픈 알림 신청</button>
        <p class="reqhint" style="margin-top:14px">선택은 건너뛰어도 신청돼요 · 이메일은 오픈 알림에만 사용해요</p>
      </div>
    </div>
  </section>
</div>
<script>function pick(el){el.classList.toggle('on');}</script>
</body></html>
