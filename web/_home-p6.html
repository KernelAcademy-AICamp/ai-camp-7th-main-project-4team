<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>패턴 06 스택 넘기기 — 실물 카드 적용</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<link rel="stylesheet" href="css/tokens.css?v=8e429c15">
<style>
/* _home-p6.html — 패턴 06(스택 넘기기)를 실물 card.html에 적용(버리는 파일 · 커밋 안 함).
   맨 앞 카드가 옆으로 넘어가며 뒤 카드가 올라옴. 자동 무한 루프. 캐릭터+제목만(아래 자물쇠). */
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--ink); font-family:var(--sans); letter-spacing:var(--ls-body); -webkit-user-select:none; user-select:none; overflow-x:hidden}
.note{background:var(--surface); border-bottom:var(--bd); padding:11px 20px; font-size:12.5px; color:var(--sub); text-align:center}
.note b{color:var(--ink)}
.hero{position:relative; overflow:hidden; text-align:center; padding:44px 0 40px}
.hero::before{content:""; position:absolute; left:50%; top:-20%; width:900px; height:900px; margin-left:-450px;
  background:radial-gradient(circle at 50% 50%, var(--green-soft), transparent 62%); opacity:.7; pointer-events:none}
.kick{position:relative; display:inline-flex; align-items:center; gap:7px; font-size:var(--fs-label); font-weight:800;
  letter-spacing:.1em; color:var(--green); background:var(--green-soft); padding:7px 14px; border-radius:20px}
h1{position:relative; font-size:clamp(38px,4.6vw,60px); font-weight:800; letter-spacing:-.058em; margin-top:16px}
h1 b{color:var(--green)}
.stage{position:relative; height:480px; margin-top:16px; perspective:1200px}
.deck{position:absolute; left:50%; top:70px; width:0; height:340px}
.card{position:absolute; left:-100px; top:0; width:200px; height:339px; border-radius:17px; overflow:hidden;
  background:#16171b; border:1px solid rgba(255,255,255,.10); box-shadow:0 18px 40px rgba(10,11,14,.28);
  transform-origin:50% 50%; will-change:transform, opacity; backface-visibility:hidden}
.card .cf{position:absolute; top:0; left:0; width:392px; height:664px; border:0; transform:scale(.5102); transform-origin:top left; pointer-events:none}
.card .veil{position:absolute; left:0; right:0; bottom:0; top:52%;
  backdrop-filter:blur(7px) saturate(.9); -webkit-backdrop-filter:blur(7px) saturate(.9);
  background:linear-gradient(180deg, rgba(22,23,27,.18), rgba(22,23,27,.46));
  -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 22px); mask-image:linear-gradient(180deg, transparent 0, #000 22px);
  display:flex; align-items:flex-start; justify-content:center; padding-top:22px; pointer-events:none}
.card .veil b{font-size:10.5px; font-weight:800; color:rgba(255,255,255,.82); display:inline-flex; align-items:center; gap:5px}
.card .veil svg{width:11px; height:11px}
@media(max-width:900px){ .stage{height:420px} .deck{top:60px} .card{width:158px; height:268px; left:-79px} .card .cf{transform:scale(.4031)} }
@media(prefers-reduced-motion:reduce){ .card{animation:none !important} }
</style>
</head>
<body>
<div class="note"><b>패턴 06 · 스택 넘기기</b> — 맨 앞 카드가 옆으로 넘어가며 뒤 카드가 올라옴 (실물 카드 · 자동 반복)</div>
<section class="hero">
  <span class="kick">체형·사이즈 진단</span>
  <h1><b>당신의 핏</b></h1>
  <div class="stage"><div class="deck" id="deck"></div></div>
</section>

<script>
(function(){
  var G='female', CODES=['TRI','INV','HRG','STR','BAL','DIA','RND','TUB'], N=8;
  var T={ total: 12000 };          // 8장 한 바퀴
  var GAP=T.total/N;               // 카드 한 장 넘기는 주기
  var deck=document.getElementById('deck');

  // 스택 뒤 깊이별 자세(뒤로 갈수록 아래·작게)
  function back(depth){ // depth 0=맨앞, N-1=맨뒤
    var y=depth*10, s=(1-depth*0.035).toFixed(3), z=40-depth;
    return 'transform:translate(0,'+y+'px) rotate(0deg) scale('+s+');opacity:1;z-index:'+z;
  }
  var css=[];
  CODES.forEach(function(code,i){
    var d=i*GAP;
    // 각 카드는 '맨앞→넘김→맨뒤→서서히 앞으로' 순환. delay로 시차.
    function P(at, decl){ return [ (((at+d)%T.total)/T.total*100), decl ]; }
    var seq=[
      P(0,            back(0)),                                                    // 맨 앞
      P(GAP*0.42,     'transform:translate(230px,-26px) rotate(15deg) scale(1);opacity:0;z-index:41'),  // 오른쪽으로 넘김
      P(GAP*0.44,     back(N-1)),                                                  // 맨 뒤로 순간 이동(투명 상태)
      P(GAP*0.46,     'transform:translate(0,'+((N-1)*10)+'px) rotate(0) scale('+(1-(N-1)*0.035).toFixed(3)+');opacity:1;z-index:'+(40-(N-1))),
      P(GAP*(N-1),    back(1)),                                                    // 서서히 앞으로 당겨짐(맨앞 직전)
      P(GAP*0.999,    back(0.02))
    ].map(function(s){ return [s[0], s[1]]; });
    // 시각 정렬
    seq.sort(function(a,b){return a[0]-b[0];});
    css.push('@keyframes flip'+i+'{\n'+seq.map(function(s){return s[0].toFixed(2)+'%{'+s[1]+'}';}).join('\n')+'\n}');
    css.push('.card[data-i="'+i+'"]{animation:flip'+i+' '+T.total+'ms linear infinite}');

    var el=document.createElement('div'); el.className='card'; el.dataset.i=i;
    el.innerHTML='<iframe class="cf" src="card.html?type='+code+'&g='+G+'" scrolling="no" tabindex="-1" title="'+code+'"></iframe>'+
      '<div class="veil"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>진단하면 열려요</b></div>';
    deck.appendChild(el);
    var f=el.querySelector('.cf'); f.addEventListener('load', function(){
      try{ var doc=f.contentDocument; if(!doc) return;
        var info=doc.querySelector('.info'); if(info) el.querySelector('.veil').style.top=(info.getBoundingClientRect().top/f.clientHeight*100)+'%';
        var st=doc.createElement('style'); st.textContent='.fig{animation:none!important}'; doc.head.appendChild(st);
      }catch(e){} });
  });
  var style=document.createElement('style'); style.textContent=css.join('\n'); document.head.appendChild(style);
})();
</script>
</body>
</html>
